<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>MonoWallet</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--bg2:#0c1220;--bg3:#121c2e;--glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.08);--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--accent:#10b981;--accent2:#059669;--adim:rgba(16,185,129,.14);--aglow:rgba(16,185,129,.28);--red:#ef4444;--amber:#f59e0b;--text1:#f1f5f9;--text2:#94a3b8;--text3:#475569}
[data-theme="light"]{--bg:#f0fdf8;--bg2:#ecfdf5;--bg3:#ffffff;--glass:rgba(0,0,0,.03);--glass2:rgba(0,0,0,.05);--border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.12);--text1:#0f172a;--text2:#475569;--text3:#94a3b8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text1);display:flex;justify-content:center;align-items:center}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
#signin{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .4s ease}
.si-inner{width:100%;max-width:380px;padding:32px 24px;display:flex;flex-direction:column;align-items:center}
.si-logo{width:62px;height:62px;background:linear-gradient(135deg,#10b981,#059669);border-radius:20px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 8px 32px rgba(16,185,129,.4)}
.pin-row{display:flex;gap:10px;justify-content:center;margin:16px 0 8px}
.pin-dot{width:54px;height:58px;border-radius:14px;background:var(--glass2);border:1.5px solid var(--border2);color:var(--text1);font-size:24px;font-weight:800;text-align:center;outline:none;caret-color:var(--accent);font-family:inherit;transition:border-color .15s}
.pin-dot:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--adim)}
.pin-dot.filled{border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.07)}
.pin-dot.err{border-color:var(--red)!important;background:rgba(239,68,68,.08)!important}
#app{width:100%;max-width:430px;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative}
.tab-panel{display:none;flex-direction:column;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 16px 90px}
.tab-panel.active{display:flex;animation:slideUp .25s ease both}
#bottom-nav{flex-shrink:0;background:rgba(7,11,20,.96);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-top:1px solid var(--border);display:flex;align-items:center;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:100}
[data-theme="light"] #bottom-nav{background:rgba(240,253,248,.97)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;cursor:pointer;color:var(--text3);font-size:10px;font-weight:700;letter-spacing:.04em;background:none;border:none;font-family:inherit;transition:color .18s;flex:1}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active{color:var(--accent)}
.card{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:18px}
.wealth-card{border-radius:22px;padding:22px;background:linear-gradient(135deg,rgba(16,185,129,.13),rgba(5,150,105,.07) 60%,transparent);border:1px solid rgba(16,185,129,.22);position:relative;overflow:hidden}
.acc-card{border-radius:18px;padding:18px;position:relative;transition:transform .18s,box-shadow .18s}
.acc-card:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.4)}
.btn{font-family:inherit;font-weight:700;cursor:pointer;border:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff;border-radius:14px;padding:14px 22px;font-size:15px}
.btn-primary:hover{background:var(--accent2);box-shadow:0 8px 24px var(--aglow)}
.btn-secondary{background:var(--glass2);color:var(--text1);border:1px solid var(--border2);border-radius:13px;padding:12px 18px;font-size:14px}
.btn-ghost{background:none;color:var(--text2);font-size:13px;font-weight:600;padding:7px 11px;border-radius:10px;font-family:inherit;cursor:pointer;border:none;transition:all .15s}
.btn-ghost:hover{color:var(--text1);background:var(--glass)}
.btn-sm{padding:9px 15px!important;font-size:13px!important;border-radius:10px!important}
.btn-xs{padding:5px 11px!important;font-size:11px!important;border-radius:8px!important}
.btn-icon{width:38px;height:38px;border-radius:10px;background:var(--glass2);border:1px solid var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;transition:all .15s;flex-shrink:0}
.btn-icon:hover{border-color:var(--border2);color:var(--text1)}
.field{background:var(--glass2);border:1.5px solid var(--border);border-radius:12px;color:var(--text1);font-family:inherit;font-size:14px;padding:12px 14px;width:100%;outline:none;transition:border-color .18s;-webkit-appearance:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--adim)}
.field::placeholder{color:var(--text3)}
.field option{background:var(--bg2)}
.lbl{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;display:block}
.cur-pill{padding:4px 10px;border-radius:100px;font-size:11px;font-weight:700;cursor:pointer;transition:all .14s;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);background:transparent;font-family:inherit}
.cur-pill.active{background:rgba(16,185,129,.25);color:#fff;border-color:rgba(16,185,129,.45)}
.cur-pill:hover:not(.active){background:rgba(255,255,255,.07)}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:transform .15s;flex:1}
.qa:hover{transform:translateY(-2px)}
.qa-icon{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.qa span{font-size:11px;font-weight:600;color:var(--text2)}
.tx-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:all .14s}
.tx-row:last-child{border-bottom:none}
.tx-row:hover{background:var(--glass);padding-left:8px;padding-right:8px;margin:0 -8px;border-radius:10px}
.tx-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-sheet{width:100%;max-width:430px;background:var(--bg2);border-radius:24px 24px 0 0;border-top:1px solid var(--border2);max-height:92dvh;overflow-y:auto;padding-bottom:32px;transform:translateY(100%);transition:transform .32s cubic-bezier(.34,1.2,.64,1)}
.modal-overlay.open .modal-sheet{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0}
.digit-row{display:flex;gap:8px;justify-content:center}
.digit-box{width:46px;height:54px;border-radius:12px;background:var(--glass2);border:1.5px solid var(--border2);color:var(--text1);font-family:inherit;font-size:22px;font-weight:800;text-align:center;outline:none;caret-color:var(--accent)}
.digit-box:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--adim)}
.digit-box.filled{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.06)}
.digit-box.err{border-color:var(--red)!important;background:rgba(239,68,68,.08)!important}
.sdots{display:flex;gap:5px;justify-content:center}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--border2);transition:all .22s}
.sdot.active{background:var(--accent);width:20px;border-radius:3px}
.sdot.done{background:rgba(16,185,129,.5)}
.bank-opt{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:13px;border:1.5px solid var(--border);cursor:pointer;transition:all .14s;background:var(--glass)}
.bank-opt:hover,.bank-opt.sel{border-color:var(--accent);background:var(--adim)}
.prog{background:rgba(255,255,255,.07);border-radius:100px;overflow:hidden}
.prog-fill{border-radius:100px;height:100%;transition:width .6s cubic-bezier(.34,1.4,.64,1)}
#toast-ctr{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;pointer-events:none;width:88%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:8px}
.toast{background:var(--bg3);border:1px solid var(--border2);border-radius:14px;padding:13px 18px;box-shadow:0 12px 40px rgba(0,0,0,.55);font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;width:100%;animation:toastUp .3s cubic-bezier(.34,1.4,.64,1) both}
@keyframes toastUp{from{opacity:0;transform:translateY(28px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast.out{animation:toastDown .22s ease forwards}
@keyframes toastDown{to{opacity:0;transform:translateY(-14px) scale(.94)}}
.flag-chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px}
.flag-large{background:rgba(239,68,68,.12);color:#fca5a5}
.flag-rec{background:rgba(139,92,246,.12);color:#c4b5fd}
.flag-unusual{background:rgba(245,158,11,.12);color:#fcd34d}
.sec-lbl{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:10px 0 5px;display:flex;align-items:center;gap:6px;color:var(--text3)}
.toggle{width:44px;height:24px;border-radius:100px;background:var(--border2);border:none;cursor:pointer;position:relative;transition:background .25s;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.toggle.on::after{transform:translateX(20px)}
.ai-card{background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(59,130,246,.07));border:1px solid rgba(16,185,129,.2);border-radius:16px;padding:16px;margin-bottom:12px}
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:9999;display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0;transform:scale(.98)}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .38s ease}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>

function classifyTx(tx){

function smartSort(txns){

  txns.forEach(tx=>{const f=classifyTx(tx);(f.length?fl:no).push({tx,flags:f});});

function stmtTxns(){

  else if(S.statementPeriod==='3month') ms=90*864e5;

function calcHealthScore(){
  const me=S.transactions.filter(t=>t.amount<0&&new Date(t.date)>=new Date(Date.now()-30*864e5)).reduce((s,t)=>s+Math.abs(t.amount),0);
  const sr=S.monthlyIncome>0?Math.max(0,(S.monthlyIncome-me)/S.monthlyIncome):0;
  const td=S.debts.filter(d=>d.dir==='owe').reduce((s,d)=>s+(d.total-d.paid),0);
  const w=netWealth(),dr=w>0?Math.min(1,td/w):(td>0?1:0),ac=Math.min(1,S.accounts.length/3);
  const score=Math.min(100,Math.max(0,Math.round(sr*45+(1-dr)*35+ac*20)));
  const sug=[];
  if(sr<0.2) sug.push('Save at least 20% of monthly income');
  if(dr>0.4) sug.push('Debts exceed 40% of wealth — prioritize repayments');
  if(S.accounts.length<2) sug.push('Link more accounts for a complete picture');
  const recs=S.transactions.filter(t=>t.amount<0&&RECURRING_KW.some(k=>t.desc.toLowerCase().includes(k)));
  if(recs.length>3) sug.push(`Audit ${recs.length} recurring subscriptions`);
  if(!sug.length) sug.push('Excellent financial discipline!');
  return {score,sr,dr,sug:sug.slice(0,3)};
}
function computeAIInsights(){
  const ins=[],mt=S.transactions.filter(t=>new Date(t.date)>=new Date(Date.now()-30*864e5));
  const exp=mt.filter(t=>t.amount<0),te=exp.reduce((s,t)=>s+Math.abs(t.amount),0);
  const ti=mt.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0),sr=ti>0?(ti-te)/ti:0;
  if(sr>=0.25) ins.push({type:'positive',title:'Strong Savings Rate',text:`Saving ${Math.round(sr*100)}% of income — above the 20% benchmark. Keep it up.`});
  else if(sr>0) ins.push({type:'warning',title:'Low Savings Rate',text:`Only ${Math.round(sr*100)}% saved. Cut discretionary spending to hit the 20% target.`});
  else ins.push({type:'danger',title:'Overspending Alert',text:`Spending exceeds income by Rs ${fmtNum(te-ti)}. Review your largest categories now.`});
  const cm={};exp.filter(t=>t.category!=='Transfer').forEach(t=>{cm[t.category]=(cm[t.category]||0)+Math.abs(t.amount);});
  const top=Object.entries(cm).sort((a,b)=>b[1]-a[1])[0];
  if(top){const pct=te>0?Math.round(top[1]/te*100):0;const tips={Housing:'Fixed cost — optimize variables instead.',Dining:'Meal-prep 2-3x/week cuts costs ~40%.',Shopping:'Apply 48-hour rule before purchases.',Entertainment:'Share plans to cut costs.'};ins.push({type:'info',title:`Top: ${top[0]}`,text:`Rs ${fmtNum(top[1])} (${pct}%). ${tips[top[0]]||'Look for savings here.'}`});}
  const recs=S.transactions.filter(t=>t.amount<0&&RECURRING_KW.some(k=>t.desc.toLowerCase().includes(k)));
  if(recs.length>0) ins.push({type:'info',title:`${recs.length} Recurring Charges`,text:`Rs ${fmtNum(recs.reduce((s,t)=>s+Math.abs(t.amount),0))}/month. Audit for unused services.`});
  return ins.slice(0,3);
}

function barChartSVG(){
  const d=S.monthlyChart,mx=Math.max(...d.flatMap(x=>[x.inc,x.exp]));
  const W=360,H=140,MB=22,UH=H-MB-8,GW=W/d.length,BW=Math.floor((GW-14)/2);
  let r='';
  d.forEach((x,i)=>{const xp=i*GW+7,ih=Math.round((x.inc/mx)*UH),eh=Math.round((x.exp/mx)*UH);r+=`<rect x="${xp}" y="${H-MB-ih}" width="${BW}" height="${ih}" fill="#22c55e" rx="3" opacity=".75"/><rect x="${xp+BW+3}" y="${H-MB-eh}" width="${BW}" height="${eh}" fill="#10b981" rx="3" opacity=".75"/><text x="${xp+BW}" y="${H-4}" text-anchor="middle" fill="#475569" font-size="9" font-family="Plus Jakarta Sans,sans-serif">${x.m}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">${r}</svg>`;
}
function donutChartHTML(){
  const cats=computeCats(),total=cats.reduce((s,c)=>s+c.amt,0);

  cats.forEach(c=>{const frac=c.amt/total,dash=(frac*C).toFixed(2),gap=(C-frac*C).toFixed(2);segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c.color}" stroke-width="${sw}" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;offset+=frac*C;});
  const leg=cats.map(c=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0"><div style="display:flex;align-items:center;gap:7px"><span style="width:10px;height:10px;border-radius:3px;background:${c.color};flex-shrink:0;display:inline-block"></span><span style="font-size:12px;color:var(--text2)">${c.cat}</span></div><span style="font-size:12px;font-weight:700">${fmtPKR(c.amt)}</span></div>`).join('');
  return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><div style="position:relative;flex-shrink:0"><svg width="${cx*2}" height="${cy*2}" viewBox="0 0 ${cx*2} ${cy*2}">${segs}</svg><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none"><p style="font-size:9px;color:var(--text3);text-transform:uppercase">Spent</p><p style="font-size:13px;font-weight:800">${fmtPKR(total)}</p></div></div><div style="flex:1;min-width:130px">${leg}</div></div>`;
}
function computeCats(){

  S.transactions.filter(t=>t.amount<0&&t.category!=='Transfer').forEach(t=>{m[t.category]=(m[t.category]||0)+Math.abs(t.amount);});

}

    <label style="display:flex;align-items:flex-start;gap:11px;padding:12px;background:var(--glass);border:1px solid var(--border);border-radius:12px;margin-bottom:9px;cursor:pointer"><input type="checkbox" id="c1" ${c1?'checked':''} onchange="S.modal.data.c1=this.checked;updateConsentBtn()" style="width:18px;height:18px;margin-top:1px;flex-shrink:0;accent-color:var(--accent)"/><span style="font-size:13px;line-height:1.5">I understand MonoWallet has <strong>read-only</strong> access</span></label>
    <label style="display:flex;align-items:flex-start;gap:11px;padding:12px;background:var(--glass);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;cursor:pointer"><input type="checkbox" id="c2" ${c2?'checked':''} onchange="S.modal.data.c2=this.checked;updateConsentBtn()" style="width:18px;height:18px;margin-top:1px;flex-shrink:0;accent-color:var(--accent)"/><span style="font-size:13px;line-height:1.5">I agree to MonoWallet's <u style="color:var(--accent)">Terms & Privacy Policy</u></span></label>
    <button id="consent-btn" class="btn btn-primary" style="width:100%;${c1&&c2?'':'opacity:.4;cursor:not-allowed'}" ${c1&&c2?'':'disabled'} data-action="lbNext">Continue</button>`;}
  if(s===5){const b=S.modal.data.selectedBank;if(!S.modal.data.foundAccounts){S.modal.data.foundAccounts=genMockAccounts(b);S.modal.data.selectedAccounts=new Set(S.modal.data.foundAccounts.map(a=>a.id));}const accs=S.modal.data.foundAccounts;
    return `${hdr('Select Accounts')}<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">${bankLogoHTML(b.id,b.color,b.abbr,36)}<div><p style="font-size:14px;font-weight:700">${b.name}</p><p style="font-size:12px;color:var(--text3)">${accs.length} account${accs.length!==1?'s':''} found</p></div></div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">${accs.map(a=>{const sel=S.modal.data.selectedAccounts.has(a.id);return `<div class="bank-opt${sel?' sel':''}" data-action="toggleFoundAcc" data-acc-id="${a.id}"><div style="display:flex;align-items:center;gap:10px;flex:1">${bankLogoHTML(b.id,b.color,b.abbr,34)}<div><p style="font-size:13px;font-weight:700">${a.type}</p><p style="font-size:11px;color:var(--text3)">${a.no} · ${fmtPKR(a.balance)}</p></div></div><div style="width:22px;height:22px;border-radius:50%;${sel?'background:var(--accent)':'background:var(--border2)'};display:flex;align-items:center;justify-content:center;flex-shrink:0">${sel?'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>':''}</div></div>`;}).join('')}</div>
    <button class="btn btn-primary" style="width:100%" data-action="completeLinkBank">Link ${S.modal.data.selectedAccounts.size} Account${S.modal.data.selectedAccounts.size!==1?'s':''}</button>`;}
  if(s===6){const b=S.modal.data.selectedBank,names=S.modal.data.linkedNames||[];return `<div style="text-align:center;padding:22px 0 6px"><div style="width:64px;height:64px;border-radius:50%;background:rgba(34,197,94,.12);border:2px solid rgba(34,197,94,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 14px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div><h2 style="font-size:20px;font-weight:800;margin-bottom:6px">Linked!</h2><p style="font-size:13px;color:var(--text2);margin-bottom:18px">${b.name} connected successfully</p><div style="text-align:left;background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.14);border-radius:13px;padding:12px 16px;margin-bottom:20px">${names.map(n=>`<p style="font-size:13px;color:#86efac;padding:3px 0">✓ ${n}</p>`).join('')}</div><button class="btn btn-primary" style="width:100%;margin-bottom:10px" onclick="closeModal();switchTab('accounts')">View Accounts</button><button class="btn btn-ghost" style="width:100%" data-action="closeModal">Done</button></div>`;}
  return '';
}
function genMockAccounts(b){const types=['Current Account','Savings Account','Mobile Wallet'];const n=1+Math.floor(Math.random()*2);return Array.from({length:n},(_,i)=>({id:`${b.id}_lnk_${i}_${Date.now()}`,type:types[i%types.length],no:`****${Math.floor(1000+Math.random()*9000)}`,balance:Math.floor(15000+Math.random()*480000),bankId:b.id,bankName:b.name,color:b.color,abbr:b.abbr,linked:new Date().toISOString().slice(0,10)}));}
function onBankSearch(v){S.modal.data.bankFilter=v;renderModal();const inp=document.getElementById('bank-search');if(inp){inp.focus();inp.setSelectionRange(v.length,v.length);}}
function updateConsentBtn(){const btn=document.getElementById('consent-btn');if(!btn)return;const ok=S.modal.data.c1&&S.modal.data.c2;btn.disabled=!ok;btn.style.opacity=ok?'1':'.4';btn.style.cursor=ok?'pointer':'not-allowed';}
function startOTPTimer(){if(S.modal.data.otpTimer)clearInterval(S.modal.data.otpTimer);S.modal.data.otpCount=60;S.modal.data.otpTimer=setInterval(()=>{S.modal.data.otpCount=(S.modal.data.otpCount||1)-1;const el=document.getElementById('otp-countdown');if(!el){clearInterval(S.modal.data.otpTimer);return;}if(S.modal.data.otpCount>0){el.textContent=`Resend in 0:${String(S.modal.data.otpCount).padStart(2,'0')}`;}else{clearInterval(S.modal.data.otpTimer);el.innerHTML='<button class="btn-ghost btn-xs" style="color:var(--accent)" data-action="resendOTP">Resend OTP</button>';}},1000);}
function handleLBNext(){
  const s=S.modal.step;
  if(s===1){if(!S.modal.data.selectedBank){toast('Select a bank','error');return;}advanceStep(2);}
  else if(s===2){const u=document.getElementById('lb-user')?.value.trim(),p=document.getElementById('lb-pass')?.value;if(!u||!p){toast('Enter credentials','error');return;}S.modal.data.username=u;S.modal.data.password=p;advanceStep(3);}
  else if(s===3){verifyOTP();}
  else if(s===4){if(!S.modal.data.c1||!S.modal.data.c2){toast('Accept all terms','error');return;}advanceStep(5);}
  else if(s===5){completeLinkBank();}
}
function verifyOTP(){const code=[0,1,2,3,4,5].map(i=>{const e=document.querySelector(`[data-otp-idx="${i}"]`);return e?e.value:'';}).join('');if(code==='123456'){advanceStep(4);}else{document.querySelectorAll('[data-otp-idx]').forEach(b=>{b.classList.add('err');b.value='';});const err=document.getElementById('otp-err');if(err)err.style.display='block';setTimeout(()=>{document.querySelectorAll('[data-otp-idx]').forEach(b=>b.classList.remove('err'));const f=document.querySelector('[data-otp-idx="0"]');if(f)f.focus();},500);}}
function completeLinkBank(){const b=S.modal.data.selectedBank,accs=S.modal.data.foundAccounts||[],sel=S.modal.data.selectedAccounts||new Set(),names=[];accs.filter(a=>sel.has(a.id)).forEach(a=>{if(S.accounts.find(x=>x.id===a.id))return;S.accounts.push({...a});names.push(`${b.name} ${a.type} ${a.no}`);});S.modal.data.linkedNames=names;advanceStep(6);launchConfetti();toast(`${names.length} account${names.length!==1?'s':''} linked!`,'success');}
function handleOTPInput(el,idx){el.value=el.value.replace(/\D/g,'').slice(-1);el.classList.toggle('filled',!!el.value);if(el.value&&idx<5){const n=document.querySelector(`[data-otp-idx="${idx+1}"]`);if(n)n.focus();}if(idx===5&&el.value){const all=[0,1,2,3,4,5].every(i=>{const e=document.querySelector(`[data-otp-idx="${i}"]`);return e&&e.value;});if(all)setTimeout(verifyOTP,120);}}
function handleDigitInput(el,attr,idx,total,cb){el.value=el.value.replace(/\D/g,'').slice(-1);if(el.value&&idx<total-1){const n=document.querySelector(`[data-${attr}-idx="${idx+1}"]`);if(n)n.focus();}if(idx===total-1&&el.value){const all=Array.from({length:total},(_,i)=>{const e=document.querySelector(`[data-${attr}-idx="${i}"]`);return e&&e.value;}).every(Boolean);if(all)setTimeout(cb,120);}}
// EFFECTS
function launchConfetti(){const cv=document.getElementById('confetti-canvas');cv.width=window.innerWidth;cv.height=window.innerHeight;cv.style.display='block';const ctx=cv.getContext('2d'),COLS=['#10b981','#22c55e','#f59e0b','#ec4899','#3b82f6','#a78bfa'];const pts=Array.from({length:100},()=>({x:Math.random()*cv.width,y:-10,vx:(Math.random()-.5)*4,vy:Math.random()*2.5+1.5,col:COLS[Math.floor(Math.random()*COLS.length)],w:Math.random()*9+4,h:Math.random()*5+3,rot:Math.random()*360,rs:(Math.random()-.5)*6,alpha:1}));let fr=0;const tick=()=>{if(fr>150){cv.style.display='none';ctx.clearRect(0,0,cv.width,cv.height);return;}ctx.clearRect(0,0,cv.width,cv.height);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.07;p.rot+=p.rs;if(fr>100)p.alpha=Math.max(0,p.alpha-.035);ctx.save();ctx.globalAlpha=p.alpha;ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.col;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});fr++;requestAnimationFrame(tick);};requestAnimationFrame(tick);}
function toast(msg,type,dur){type=type||'info';dur=dur||3200;const colors={info:'var(--text2)',success:'#4ade80',error:'#f87171',warning:'#fcd34d'};const svgs={success:'<polyline points="20 6 9 17 4 12"/>',error:'<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',warning:'<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>',info:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>'};const el=document.createElement('div');el.className='toast';el.style.borderLeftColor=colors[type]||colors.info;el.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${colors[type]||colors.info}" stroke-width="2.5" stroke-linecap="round">${svgs[type]||svgs.info}</svg><span style="color:var(--text1)">${msg}</span>`;const ctr=document.getElementById('toast-ctr');if(ctr.children.length>=3)ctr.removeChild(ctr.firstChild);ctr.appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),280);},dur);}
function startRates(){setInterval(()=>{Object.keys(S.rates).forEach(c=>{if(c==='PKR')return;S.rates[c]=BASE_RATES[c]*(1+(Math.random()-.5)*0.01);});S.ratesTs=Date.now();if(S.activeTab==='home'){const d=document.getElementById('nw-display'),t=document.getElementById('rate-ts');if(d)d.textContent=fmtAmt(netWealth());if(t)t.textContent='just now';}},30000);setInterval(()=>{const t=document.getElementById('rate-ts');if(t&&S.activeTab==='home')t.textContent=secsAgo(S.ratesTs)+'s ago';},1000);}
// EVENTS
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const{action,tab,cur,period,modal}=el.dataset;
  switch(action){
    case 'doSignIn': verifySIPin(); break;
    case 'switchTab': switchTab(tab); break;
    case 'openModal': openModal(modal); break;
    case 'closeModal': closeModal(); break;
    case 'setPeriod': S.statementPeriod=period;if(S.activeTab==='home')renderHome();break;
    case 'switchCur':
      S.displayCurrency=cur;
      document.querySelectorAll('.cur-pill').forEach(p=>p.classList.toggle('active',p.dataset.cur===cur));
      const nwEl=document.getElementById('nw-display');
      if(nwEl){nwEl.style.opacity='0.4';setTimeout(()=>{nwEl.textContent=fmtAmt(netWealth());nwEl.style.opacity='1';},180);}
      break;
    case 'toggleTheme':
      S.darkMode=!S.darkMode;
      document.documentElement.dataset.theme=S.darkMode?'dark':'light';
      el.classList.toggle('on',S.darkMode);
      break;
    case 'toggleNotif': el.classList.toggle('on'); break;
    case 'signOut':
      closeModal();
      const si2=document.getElementById('signin'),app2=document.getElementById('app');
      app2.style.display='none';si2.style.display='flex';si2.style.animation='fadeIn .4s ease both';
      [0,1,2,3].forEach(i=>{const e=document.querySelector(`[data-si-idx="${i}"]`);if(e){e.value='';e.classList.remove('filled');}});
      document.getElementById('si-err').style.display='none';
      setTimeout(()=>{const f=document.querySelector('[data-si-idx="0"]');if(f)f.focus();},100);
      break;
    case 'lbNext': handleLBNext(); break;
    case 'lbBack': S.modal.step=Math.max(1,S.modal.step-1);renderModal(); break;
    case 'selectBank':{const bank=BANKS.find(b=>b.id===el.dataset.bankId);if(bank){S.modal.data.selectedBank=bank;renderModal();}break;}
    case 'verifyOTP': verifyOTP(); break;
    case 'resendOTP': S.modal.data.otpCount=60;startOTPTimer();document.querySelectorAll('[data-otp-idx]').forEach(b=>{b.value='';b.classList.remove('filled');});const oerr=document.getElementById('otp-err');if(oerr)oerr.style.display='none';setTimeout(()=>{const f=document.querySelector('[data-otp-idx="0"]');if(f)f.focus();},60);break;
    case 'completeLinkBank': completeLinkBank(); break;
    case 'toggleFoundAcc':{if(!S.modal.data.selectedAccounts)S.modal.data.selectedAccounts=new Set();const aid=el.dataset.accId;if(S.modal.data.selectedAccounts.has(aid))S.modal.data.selectedAccounts.delete(aid);else S.modal.data.selectedAccounts.add(aid);renderModal();break;}
    case 'txDetail':{const txId=el.dataset.txId;const tx=S.transactions.find(t=>t.id===txId);if(tx)openModal('txDetail',{tx});break;}
    case 'addExpense':{
      const desc=document.getElementById('exp-desc')?.value.trim(),amt=parseFloat(document.getElementById('exp-amt')?.value),cat=document.getElementById('exp-cat')?.value,acc=document.getElementById('exp-acc')?.value,date=document.getElementById('exp-date')?.value||new Date().toISOString().slice(0,10);
      if(!desc||isNaN(amt)||amt<=0||!cat||!acc){toast('Fill in all fields','error');break;}
      S.transactions.unshift({id:S.uid(),date,desc,amount:-amt,type:'debit',category:cat,accId:acc});
      toast('Expense added','success');renderSpending();break;
    }
    case 'showAddDebt':{const a=document.getElementById('add-debt-area');if(a)a.style.display=a.style.display==='none'?'block':'none';break;}
    case 'addDebt':{
      const label=document.getElementById('debt-label')?.value.trim(),total=parseFloat(document.getElementById('debt-total')?.value),paid=parseFloat(document.getElementById('debt-paid')?.value)||0,due=document.getElementById('debt-due')?.value,dir=document.getElementById('debt-dir')?.value||'owe',apr=parseFloat(document.getElementById('debt-apr')?.value)||0;
      if(!label||isNaN(total)||total<=0){toast('Enter label and amount','error');break;}
      S.debts.push({id:S.uid(),label,total,paid,due,dir,apr,type:'loan'});
      toast('Added','success');renderMore();break;
    }
    case 'settleDebt':{const idx=S.debts.findIndex(d=>d.id===el.dataset.debtId);if(idx!==-1){const d=S.debts[idx],rem=d.total-d.paid,src=S.accounts[0];if(src&&src.balance>=rem){src.balance-=rem;S.transactions.unshift({id:S.uid(),date:new Date().toISOString().slice(0,10),desc:`Settled: ${d.label}`,amount:-rem,type:'debit',category:'Transfer',accId:src.id});}S.debts.splice(idx,1);toast(`Settled!`,'success');renderMore();}break;}
    case 'removeDebt':{const idx2=S.debts.findIndex(d=>d.id===el.dataset.debtId);if(idx2!==-1){S.debts.splice(idx2,1);toast('Removed','info');renderMore();}break;}
    case 'markReturned': openModal('markReturned',{debtId:el.dataset.debtId}); break;
    case 'confirmReturn':{
      const debtId=el.dataset.debtId,d=S.debts.find(x=>x.id===debtId);
      if(d){d.paid=d.total;toast(`${d.label} marked as returned!`,'success');closeModal();renderMore();}
      break;
    }
    case 'saveIncome':{const v=parseFloat(document.getElementById('inc-field')?.value);if(isNaN(v)||v<0){toast('Invalid amount','error');break;}S.monthlyIncome=v;toast('Saved','success');break;}
  }
});
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('modal-overlay'))closeModal();});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='bank-search'){onBankSearch(t.value);return;}
  if(t.dataset.siIdx!==undefined){handleSIInput(t,parseInt(t.dataset.siIdx));return;}
  if(t.dataset.otpIdx!==undefined){handleOTPInput(t,parseInt(t.dataset.otpIdx));return;}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Backspace')return;
  const t=e.target;
  let prefix=null,idx=-1;
  if(t.dataset.siIdx!==undefined){prefix='si';idx=parseInt(t.dataset.siIdx);}
  else if(t.dataset.otpIdx!==undefined){prefix='otp';idx=parseInt(t.dataset.otpIdx);}
  if(prefix==='si'&&!t.value&&idx>0){const p=document.querySelector(`[data-si-idx="${idx-1}"]`);if(p){p.focus();p.value='';p.classList.remove('filled');}}
  else if(prefix==='otp'&&!t.value&&idx>0){const p=document.querySelector(`[data-otp-idx="${idx-1}"]`);if(p){p.focus();p.value='';p.classList.remove('filled');}}
});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='c1'||t.id==='c2'){S.modal.data[t.id]=t.checked;updateConsentBtn();}});
function init(){setTimeout(()=>{const f=document.querySelector('[data-si-idx="0"]');if(f)f.focus();},100);}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>

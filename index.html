<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>MonoWallet</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="MonoWallet"/>
<meta name="theme-color" content="#059669"/>
<link id="ati" rel="apple-touch-icon" sizes="180x180" href=""/>
<script>(function(){const m=window.matchMedia('(prefers-color-scheme: dark)');document.documentElement.dataset.theme=m.matches?'dark':'light';document.documentElement.dataset.themeMode='system';}());</script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--bg2:#0d1117;--bg3:#131a24;--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.1);--glass3:rgba(255,255,255,.18);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);--accent:#10b981;--accent2:#059669;--adim:rgba(16,185,129,.15);--aglow:rgba(16,185,129,.32);--red:#ef4444;--amber:#f59e0b;--text1:#f1f5f9;--text2:#94a3b8;--text3:#4b5e75;--hero-num:#ffffff;--hero-sub:rgba(255,255,255,.6);--hero-dim:rgba(255,255,255,.35);--clr-up:#4ade80;--clr-down:#f87171;--clr-owe:#fca5a5;--clr-lent:#86efac;--lqg:rgba(255,255,255,.055);--lqg-border:rgba(255,255,255,.11);--card-shadow:0 8px 32px rgba(0,0,0,.32);--ftb-bg:rgba(10,16,26,.5);--pill-bg:rgba(255,255,255,.18);--pill-border:rgba(255,255,255,.24)}
[data-theme="light"]{--bg:#edfaf4;--bg2:#e0f5ec;--bg3:#ffffff;--glass:rgba(255,255,255,.52);--glass2:rgba(255,255,255,.72);--glass3:rgba(255,255,255,.92);--border:rgba(16,185,129,.1);--border2:rgba(16,185,129,.22);--text1:#0f172a;--text2:#334155;--text3:#64748b;--hero-num:#0f172a;--hero-sub:#334155;--hero-dim:#64748b;--clr-up:#16a34a;--clr-down:#dc2626;--clr-owe:#dc2626;--clr-lent:#16a34a;--lqg:rgba(255,255,255,.58);--lqg-border:rgba(255,255,255,.88);--card-shadow:0 8px 32px rgba(0,0,0,.07);--ftb-bg:rgba(255,255,255,.26);--pill-bg:rgba(255,255,255,.86);--pill-border:rgba(255,255,255,.96)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text1);display:flex;justify-content:center;align-items:center}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
/* ── Sign-in ─────────────────────────────────────────────────────────────── */
#signin{position:fixed;inset:0;background:var(--bg);background-image:radial-gradient(ellipse 80% 50% at 18% 10%,rgba(16,185,129,.18) 0%,transparent 60%),radial-gradient(ellipse 55% 40% at 82% 88%,rgba(59,130,246,.11) 0%,transparent 60%);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .4s ease}
.si-inner{width:100%;max-width:360px;padding:36px 28px;display:flex;flex-direction:column;align-items:center;background:var(--lqg);backdrop-filter:blur(32px) saturate(160%);-webkit-backdrop-filter:blur(32px) saturate(160%);border:1px solid var(--lqg-border);border-radius:28px;box-shadow:0 24px 64px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.12)}
.si-logo{width:64px;height:64px;background:linear-gradient(135deg,#10b981,#059669);border-radius:22px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 10px 40px rgba(16,185,129,.45)}
.pin-row{display:flex;gap:10px;justify-content:center;margin:16px 0 8px}
.pin-dot{width:54px;height:58px;border-radius:14px;background:var(--glass2);border:1.5px solid var(--border2);color:var(--text1);font-size:24px;font-weight:800;text-align:center;outline:none;caret-color:var(--accent);font-family:inherit;transition:border-color .15s}
.pin-dot:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--adim)}
.pin-dot.filled{border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.08)}
.pin-dot.err{border-color:var(--red)!important;background:rgba(239,68,68,.08)!important}
/* ── App shell ───────────────────────────────────────────────────────────── */
#app{width:100%;max-width:430px;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);background-image:radial-gradient(ellipse 80% 48% at 15% 8%,rgba(16,185,129,.14) 0%,transparent 55%),radial-gradient(ellipse 55% 38% at 85% 86%,rgba(59,130,246,.09) 0%,transparent 55%);position:relative;overflow:hidden}
#app-header{flex-shrink:0;height:62px;background:var(--lqg);backdrop-filter:blur(44px) saturate(180%);-webkit-backdrop-filter:blur(44px) saturate(180%);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;z-index:50;box-shadow:0 1px 24px rgba(0,0,0,.1)}
.hdr-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;cursor:pointer;flex-shrink:0;box-shadow:0 2px 10px rgba(16,185,129,.4)}
.hdr-search{flex:1;background:var(--glass2);border:1px solid var(--border2);border-radius:22px;height:36px;display:flex;align-items:center;padding:0 14px;gap:8px;cursor:pointer;transition:all .15s}
.hdr-search:hover{background:var(--glass3);border-color:var(--accent)}
.hdr-search span{font-size:13px;color:var(--text3);font-weight:500}
.hdr-icon-btn{width:36px;height:36px;border-radius:50%;background:var(--glass2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;flex-shrink:0;transition:all .15s}
.hdr-icon-btn:hover{background:var(--glass3);border-color:var(--accent)}
.theme-sun,.theme-moon,.theme-auto{display:none}
[data-theme-mode="light"] .theme-sun{display:flex}
[data-theme-mode="dark"] .theme-moon{display:flex}
[data-theme-mode="system"] .theme-auto{display:flex}
.tab-panel{display:none;flex-direction:column;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 16px 112px}
.tab-panel.active{display:flex;animation:slideUp .22s ease both}
/* ── Floating Tab Bar ────────────────────────────────────────────────────── */
#bottom-nav{flex-shrink:0;height:calc(90px + env(safe-area-inset-bottom,0px));background:transparent;border:none;position:relative}
.ftb{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;padding:0 6px;border-radius:100px;gap:0;background:var(--ftb-bg);backdrop-filter:blur(60px) saturate(180%);-webkit-backdrop-filter:blur(60px) saturate(180%);border:1px solid rgba(255,255,255,.2);box-shadow:0 8px 32px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.18);z-index:200;width:min(92vw,440px);height:58px;overflow:visible;touch-action:none;user-select:none}
[data-theme="light"] .ftb{border-color:rgba(255,255,255,.62);box-shadow:0 8px 28px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.05),inset 0 1px 0 rgba(255,255,255,.82)}
.nav-pill-bg{position:absolute;top:5px;left:0;height:calc(100% - 10px);width:80px;border-radius:100px;background:radial-gradient(ellipse 58% 72% at 38% 26%,rgba(255,255,255,.42) 0%,transparent 64%),var(--pill-bg);backdrop-filter:blur(24px) saturate(200%) brightness(108%);-webkit-backdrop-filter:blur(24px) saturate(200%) brightness(108%);border:1px solid var(--pill-border);box-shadow:inset 0 1px 0 rgba(255,255,255,.72),inset 1px 0 0 rgba(255,255,255,.22),inset -1px 0 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.1),0 4px 20px rgba(0,0,0,.18),0 2px 10px rgba(16,185,129,.1);filter:url(#lns);transition:left .45s cubic-bezier(.34,1.3,.64,1),width .45s cubic-bezier(.34,1.3,.64,1),transform .3s cubic-bezier(.34,1.5,.64,1);will-change:left,width,transform;pointer-events:none;z-index:0;transform-origin:center center}
[data-theme="light"] .nav-pill-bg{background:radial-gradient(ellipse 58% 72% at 38% 26%,rgba(255,255,255,.68) 0%,transparent 64%),var(--pill-bg);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 1px 0 0 rgba(255,255,255,.5),inset -1px 0 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.08),0 2px 8px rgba(16,185,129,.08)}
.ftb.dragging .nav-pill-bg{filter:url(#lns-drag);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 1px 0 0 rgba(255,255,255,.3),inset -1px 0 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,0,0,.12),0 8px 32px rgba(0,0,0,.26),0 4px 20px rgba(16,185,129,.22);transition:filter .16s,box-shadow .16s}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:1;height:100%;cursor:pointer;color:var(--text3);font-size:10px;font-weight:700;letter-spacing:.04em;background:none;border:none;font-family:inherit;transition:color .2s,transform .14s cubic-bezier(.34,1.5,.64,1);position:relative;z-index:1;white-space:nowrap;-webkit-tap-highlight-color:transparent;touch-action:none}
.nav-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .32s cubic-bezier(.34,1.5,.64,1)}
.nav-btn.active{color:var(--accent)}
.nav-btn.active svg{animation:navPop .36s cubic-bezier(.34,1.5,.64,1) both}
.nav-btn.drag-hover{color:var(--accent)}
.nav-btn.drag-hover svg{transform:scale(1.18)}
.nav-btn:active{transform:scale(.93);transition:transform .08s}
@keyframes navPop{0%{transform:scale(.8)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
/* ── Cards & glass surfaces ──────────────────────────────────────────────── */
.card{background:var(--lqg);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border:1px solid var(--lqg-border);border-radius:18px;box-shadow:var(--card-shadow),inset 0 1px 0 rgba(255,255,255,.09)}
.hero-section{text-align:center;padding:24px 8px 18px;position:relative}
.hero-glow{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:280px;height:140px;background:radial-gradient(ellipse,rgba(16,185,129,.22) 0%,transparent 70%);pointer-events:none;filter:blur(28px)}
.cur-pill{padding:5px 11px;border-radius:100px;font-size:11px;font-weight:700;cursor:pointer;transition:all .14s;border:1px solid var(--border2);color:var(--text3);background:transparent;font-family:inherit}
.cur-pill.active{background:var(--adim);color:var(--accent);border-color:rgba(16,185,129,.4)}
.cur-pill:hover:not(.active){background:var(--glass2)}
.cur-dd-wrapper{position:relative;display:inline-flex;align-items:center}
.cur-dd-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:100px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--border2);color:var(--text1);background:var(--glass2);font-family:inherit;transition:all .14s}
.cur-dd-btn:hover{background:var(--glass3);border-color:var(--accent)}
.cur-dd-btn .dd-chevron{transition:transform .18s}
.cur-dd-btn.open .dd-chevron{transform:rotate(180deg)}
.cur-dropdown{position:absolute;top:calc(100% + 7px);right:0;left:auto;transform:none;min-width:150px;background:var(--bg3);border:1px solid var(--border2);border-radius:14px;box-shadow:0 14px 48px rgba(0,0,0,.22);z-index:300;overflow:hidden;animation:slideUp .16s ease both}
.cur-dd-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-size:13px;font-weight:600;color:var(--text1);cursor:pointer;transition:background .12s;font-family:inherit;border:none;background:none;width:100%;text-align:left}
.cur-dd-item:hover{background:var(--glass2)}
.cur-dd-item.sel{color:var(--accent)}
.cur-dd-divider{height:1px;background:var(--border);margin:2px 0}
.shortcut-tile{background:var(--lqg);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid var(--lqg-border);border-radius:18px;padding:16px 10px 12px;cursor:pointer;transition:transform .18s,box-shadow .18s,background .15s;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;box-shadow:var(--card-shadow),inset 0 1px 0 rgba(255,255,255,.08)}
.shortcut-tile:hover{background:var(--glass2);transform:translateY(-3px);box-shadow:0 14px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12)}
.shortcut-tile:active{transform:scale(.95)}
.qa-pill{background:var(--glass2);border:1px solid var(--border2);border-radius:100px;padding:10px 16px;font-size:13px;font-weight:700;color:var(--text1);cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px;flex:1;justify-content:center}
.qa-pill:hover{background:var(--glass3)}
.qa-pill.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 6px 20px var(--aglow)}
.qa-pill.primary:hover{background:var(--accent2)}
.btn{font-family:inherit;font-weight:700;cursor:pointer;border:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff;border-radius:14px;padding:14px 22px;font-size:15px}
.btn-primary:hover{background:var(--accent2);box-shadow:0 8px 24px var(--aglow)}
.btn-secondary{background:var(--glass2);color:var(--text1);border:1px solid var(--border2);border-radius:13px;padding:12px 18px;font-size:14px}
.btn-ghost{background:none;color:var(--text2);font-size:13px;font-weight:600;padding:7px 11px;border-radius:10px;font-family:inherit;cursor:pointer;border:none;transition:all .15s}
.btn-ghost:hover{color:var(--text1);background:var(--glass)}
.btn-sm{padding:9px 15px!important;font-size:13px!important;border-radius:10px!important}
.btn-xs{padding:5px 11px!important;font-size:11px!important;border-radius:8px!important}
.btn-icon{width:38px;height:38px;border-radius:10px;background:var(--glass2);border:1px solid var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;transition:all .15s;flex-shrink:0}
.btn-icon:hover{border-color:var(--border2);color:var(--text1)}
.field{background:var(--glass2);border:1.5px solid var(--border);border-radius:12px;color:var(--text1);font-family:inherit;font-size:14px;padding:12px 14px;width:100%;outline:none;transition:border-color .18s;-webkit-appearance:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--adim)}
.field::placeholder{color:var(--text3)}
.field option{background:var(--bg2)}
.lbl{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;display:block}
.acc-card{border-radius:18px;padding:18px;position:relative;transition:transform .18s,box-shadow .18s;box-shadow:var(--card-shadow)}
.acc-card:hover{transform:translateY(-2px)}
.tx-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:all .14s}
.tx-row:last-child{border-bottom:none}
.tx-row:hover{background:var(--glass);padding-left:8px;padding-right:8px;margin:0 -8px;border-radius:10px}
.tx-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-sheet{width:100%;max-width:430px;background:var(--bg2);backdrop-filter:blur(44px) saturate(170%);-webkit-backdrop-filter:blur(44px) saturate(170%);border-radius:28px 28px 0 0;border-top:1px solid var(--border2);box-shadow:0 -6px 48px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12);max-height:92dvh;overflow-y:auto;padding-bottom:32px;transform:translateY(100%);transition:transform .34s cubic-bezier(.34,1.2,.64,1)}
.modal-overlay.open .modal-sheet{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:14px auto 0}
.digit-box{width:46px;height:54px;border-radius:12px;background:var(--glass2);border:1.5px solid var(--border2);color:var(--text1);font-family:inherit;font-size:22px;font-weight:800;text-align:center;outline:none;caret-color:var(--accent)}
.digit-box:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--adim)}
.digit-box.filled{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.06)}
.digit-box.err{border-color:var(--red)!important;background:rgba(239,68,68,.08)!important}
.sdots{display:flex;gap:5px;justify-content:center}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--border2);transition:all .22s}
.sdot.active{background:var(--accent);width:20px;border-radius:3px}
.sdot.done{background:rgba(16,185,129,.5)}
.bank-opt{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:13px;border:1.5px solid var(--border);cursor:pointer;transition:all .14s;background:var(--glass)}
.bank-opt:hover,.bank-opt.sel{border-color:var(--accent);background:var(--adim)}
.prog{background:var(--glass2);border-radius:100px;overflow:hidden}
.prog-fill{border-radius:100px;height:100%}
.toggle{width:44px;height:24px;border-radius:100px;background:var(--border2);border:none;cursor:pointer;position:relative;transition:background .25s;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.toggle.on::after{transform:translateX(20px)}
.ai-card{background:linear-gradient(135deg,rgba(16,185,129,.09),rgba(59,130,246,.06));border:1px solid rgba(16,185,129,.18);border-radius:16px;padding:16px;margin-bottom:12px}
.flag-chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px}
.flag-large{background:rgba(239,68,68,.12);color:var(--clr-owe)}
.flag-rec{background:rgba(139,92,246,.12);color:#c4b5fd}
.flag-unusual{background:rgba(245,158,11,.12);color:#fcd34d}
.sec-lbl{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:10px 0 5px;display:flex;align-items:center;gap:6px;color:var(--text3)}
#toast-ctr{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:9999;pointer-events:none;width:88%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:8px}
.toast{background:var(--bg3);border:1px solid var(--border2);border-radius:14px;padding:13px 18px;box-shadow:0 12px 40px rgba(0,0,0,.55);font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;width:100%;color:var(--text1);animation:toastUp .3s cubic-bezier(.34,1.4,.64,1) both}
@keyframes toastUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.toast.out{animation:toastDown .22s ease forwards}
@keyframes toastDown{to{opacity:0;transform:translateY(18px)}}
.skel{background:var(--glass2);border-radius:8px;overflow:hidden;position:relative}
.skel::after{content:'';position:absolute;inset:0;transform:translateX(-100%);animation:shimmer 1.6s ease-in-out infinite;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.1) 50%,transparent 100%)}
[data-theme="light"] .skel::after{background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.65) 50%,transparent 100%)}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.rc{opacity:0;transform:translateY(24px);transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .5s cubic-bezier(.16,1,.3,1)}
.rc.in{opacity:1;transform:translateY(0)}
.rc.d1{transition-delay:.07s}.rc.d2{transition-delay:.14s}.rc.d3{transition-delay:.21s}.rc.d4{transition-delay:.28s}
.prog-fill{transition:width 1.1s cubic-bezier(.16,1,.3,1)}
@keyframes barGrow{0%{transform:scaleY(0);transform-origin:bottom}100%{transform:scaleY(1);transform-origin:bottom}}
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:9999;display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0;transform:scale(.98)}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .38s ease}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.bar-rect{transform-box:fill-box;transform-origin:50% 100%}
@keyframes countUpPop{0%{transform:scale(.92);opacity:.4}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.num-pop{animation:countUpPop .45s cubic-bezier(.34,1.4,.64,1) both}

// NAV — spring physics version counter (cancels superseded RAF loops)
let _spV=0;
function springSnap(pill,toL,toW,initVelX){
  const ver=++_spV;
  const K=195,B=25;
  let L=parseFloat(pill.style.left)||0;
  let W=parseFloat(pill.style.width)||toW;
  const mSX=pill.style.transform.match(/scaleX\(([\d.]+)\)/);
  let SX=mSX?parseFloat(mSX[1]):1;
  let vL=initVelX||0,vW=0,vSX=0;
  let last=performance.now();
  pill.style.transition='none';
  (function step(now){
    if(_spV!==ver)return;
    const dt=Math.min((now-last)/1000,.02);last=now;
    vL+=(-K*(L-toL)-B*vL)*dt; L+=vL*dt;
    vW+=(-K*(W-toW)-B*vW)*dt; W+=vW*dt;
    vSX+=(-K*(SX-1)-B*vSX)*dt; SX+=vSX*dt;
    pill.style.left=L+'px';
    pill.style.width=W+'px';
    pill.style.transform=`scaleX(${SX})`;
    const done=Math.abs(L-toL)<.4&&Math.abs(vL)<2&&Math.abs(W-toW)<.4&&Math.abs(vW)<2&&Math.abs(SX-1)<.003&&Math.abs(vSX)<.03;
    if(done){pill.style.left=toL+'px';pill.style.width=toW+'px';pill.style.transform='scaleX(1)';pill.style.transition='';}
    else requestAnimationFrame(step);
  })(performance.now());
}

function initNavDrag(){
  const ftb=document.getElementById('ftb');
  const pill=document.getElementById('nav-pill-bg');
  if(!ftb||!pill)return;
  const btns=Array.from(ftb.querySelectorAll('.nav-btn'));
  let dragging=false,startX=0,startY=0,prevX=0,prevT=0,velX=0;
  function nearestIdx(lx){
    let best=0,bd=Infinity;
    btns.forEach((b,i)=>{const cx=b.offsetLeft+b.offsetWidth/2;const d=Math.abs(lx-cx);if(d<bd){bd=d;best=i;}});
    return best;
  }
  function widthAtX(lx){
    for(let i=0;i<btns.length-1;i++){
      const lcx=btns[i].offsetLeft+btns[i].offsetWidth/2;
      const rcx=btns[i+1].offsetLeft+btns[i+1].offsetWidth/2;
      if(lx>=lcx&&lx<=rcx){
        let t=(lx-lcx)/(rcx-lcx);
        t=t<.5?2*t*t:1-2*(1-t)*(1-t); // ease in-out
        return btns[i].offsetWidth*(1-t)+btns[i+1].offsetWidth*t;
      }
    }
    return lx<=btns[0].offsetLeft+btns[0].offsetWidth/2?btns[0].offsetWidth:btns[btns.length-1].offsetWidth;
  }
  ftb.addEventListener('pointerdown',e=>{
    _spV++; // cancel spring before drag
    startX=e.clientX;startY=e.clientY;prevX=e.clientX;prevT=performance.now();velX=0;dragging=false;
  });
  ftb.addEventListener('pointermove',e=>{
    if(!e.buttons)return;
    const dx=e.clientX-startX,dy=e.clientY-startY;
    if(!dragging&&Math.sqrt(dx*dx+dy*dy)>6){
      dragging=true;ftb.classList.add('dragging');ftb.setPointerCapture(e.pointerId);
      pill.style.transition='none';
    }
    if(!dragging)return;
    e.preventDefault();e.stopPropagation();
    const now=performance.now(),dt=now-prevT;
    if(dt>0)velX=(e.clientX-prevX)/dt*16;
    prevX=e.clientX;prevT=now;
    const rect=ftb.getBoundingClientRect();
    const lx=e.clientX-rect.left;
    const firstCx=btns[0].offsetLeft+btns[0].offsetWidth/2;
    const lastCx=btns[btns.length-1].offsetLeft+btns[btns.length-1].offsetWidth/2;
    const clx=Math.max(firstCx,Math.min(lastCx,lx));
    const w=widthAtX(clx);
    pill.style.left=(clx-w/2)+'px';
    pill.style.width=w+'px';
    // squash-and-stretch: wider when moving fast
    const stretch=1+Math.min(Math.abs(velX)/360,.22);
    pill.style.transform=`scaleX(${stretch})`;
    btns.forEach((b,i)=>b.classList.toggle('drag-hover',i===nearestIdx(lx)));
  },{passive:false});
  function endDrag(e){
    if(!dragging)return;
    dragging=false;ftb.classList.remove('dragging');
    btns.forEach(b=>b.classList.remove('drag-hover'));
    const rect=ftb.getBoundingClientRect();
    const lx=e.clientX-rect.left;
    const ni=nearestIdx(lx);
    const target=btns[ni]?.dataset.tab;
    springSnap(pill,btns[ni].offsetLeft,btns[ni].offsetWidth,velX);
    if(target&&target!==S.activeTab){
      // update state + render without re-running updateNavPill (spring handles position)
      S.activeTab=target;
      document.querySelectorAll('.tab-panel').forEach(el=>el.classList.toggle('active',el.id==='tab-'+target));
      document.querySelectorAll('.nav-btn').forEach(el=>el.classList.toggle('active',el.dataset.tab===target));
      renderTab(target);
    }
  }
  ftb.addEventListener('pointerup',e=>endDrag(e));
  ftb.addEventListener('pointercancel',()=>{
    if(!dragging)return;
    dragging=false;ftb.classList.remove('dragging');
    btns.forEach(b=>b.classList.remove('drag-hover'));
    const ai=btns.findIndex(b=>b.classList.contains('active'));
    if(ai>=0)springSnap(pill,btns[ai].offsetLeft,btns[ai].offsetWidth,0);
  });
}

function barChartSVG(){
  const d=S.monthlyChart,mx=Math.max(...d.flatMap(x=>[x.inc,x.exp]));
  const W=360,H=140,MB=22,UH=H-MB-8,GW=W/d.length,BW=Math.floor((GW-14)/2);let r='';

    r+=`<rect class="bar-rect" x="${xp}" y="${H-MB-ih}" width="${BW}" height="${ih}" fill="#22c55e" rx="3" opacity=".78" style="animation:barGrow .72s cubic-bezier(.16,1,.3,1) ${(i*.1).toFixed(2)}s both"/>`;
    r+=`<rect class="bar-rect" x="${xp+BW+3}" y="${H-MB-eh}" width="${BW}" height="${eh}" fill="#10b981" rx="3" opacity=".78" style="animation:barGrow .72s cubic-bezier(.16,1,.3,1) ${(i*.1+.05).toFixed(2)}s both"/>`;
    r+=`<text x="${xp+BW}" y="${H-4}" text-anchor="middle" fill="var(--text3-hex,#475569)" font-size="9" font-family="Plus Jakarta Sans,sans-serif">${x.m}</text>`;
  });

}
function donutChartHTML(){

  const mockH={binance:[{sym:'BTC',qty:+(Math.random()*0.08+0.01).toFixed(4)},{sym:'USDT',qty:Math.floor(200+Math.random()*1200)}],redotpay:[{sym:'USDT',qty:Math.floor(80+Math.random()*600)},{sym:'ETH',qty:+(Math.random()*0.15+0.01).toFixed(4)}],fasset:[{sym:'USDC',qty:Math.floor(100+Math.random()*2000)}],phantom:[{sym:'SOL',qty:+(Math.random()*18+1).toFixed(2)},{sym:'USDC',qty:Math.floor(50+Math.random()*500)}],metamask:[{sym:'ETH',qty:+(Math.random()*0.8+0.01).toFixed(4)},{sym:'USDC',qty:Math.floor(80+Math.random()*800)}],okx:[{sym:'BTC',qty:+(Math.random()*0.05+0.005).toFixed(4)},{sym:'USDT',qty:Math.floor(100+Math.random()*900)}],coinbase:[{sym:'ETH',qty:+(Math.random()*0.5+0.01).toFixed(4)},{sym:'USDC',qty:Math.floor(50+Math.random()*500)}],bybit:[{sym:'USDT',qty:Math.floor(100+Math.random()*1000)},{sym:'BNB',qty:+(Math.random()*2+0.1).toFixed(3)}]};
  const holdings=(mockH[cw.id]||[{sym:'USDT',qty:Math.floor(50+Math.random()*500)}]);
  const balancePKR=Math.round(holdings.reduce((s,h)=>s+(h.qty*(CRYPTO_PRICES_PKR[h.sym]||278)),0));
  const change24h=+((Math.random()-0.45)*8).toFixed(1);
  S.cryptoAccounts.push({id:'cx'+S.uid(),walletId:cw.id,walletName:cw.name,abbr:cw.abbr,color:cw.color,address:addr,holdings,balancePKR,change24h,linked:new Date().toISOString().slice(0,10)});
  advanceStep(3);launchConfetti();toast(`${cw.name} wallet linked!`,'success');
}
function verifyOTP(){const code=[0,1,2,3,4,5].map(i=>{const e=document.querySelector(`[data-otp-idx="${i}"]`);return e?e.value:'';}).join('');if(code==='123456'){advanceStep(4);}else{document.querySelectorAll('[data-otp-idx]').forEach(b=>{b.classList.add('err');b.value='';});const err=document.getElementById('otp-err');if(err)err.style.display='block';setTimeout(()=>{document.querySelectorAll('[data-otp-idx]').forEach(b=>b.classList.remove('err'));const f=document.querySelector('[data-otp-idx="0"]');if(f)f.focus();},500);}}
function completeLinkBank(){const b=S.modal.data.selectedBank,accs=S.modal.data.foundAccounts||[],sel=S.modal.data.selectedAccounts||new Set(),names=[];accs.filter(a=>sel.has(a.id)).forEach(a=>{if(S.accounts.find(x=>x.id===a.id))return;S.accounts.push({...a});names.push(`${b.name} ${a.type} ${a.no}`);});S.modal.data.linkedNames=names;advanceStep(6);launchConfetti();toast(`${names.length} account${names.length!==1?'s':''} linked!`,'success');}
function handleOTPInput(el,idx){el.value=el.value.replace(/\D/g,'').slice(-1);el.classList.toggle('filled',!!el.value);if(el.value&&idx<5){const n=document.querySelector(`[data-otp-idx="${idx+1}"]`);if(n)n.focus();}if(idx===5&&el.value){const all=[0,1,2,3,4,5].every(i=>{const e=document.querySelector(`[data-otp-idx="${i}"]`);return e&&e.value;});if(all)setTimeout(verifyOTP,120);}}
// EFFECTS
function launchConfetti(){const cv=document.getElementById('confetti-canvas');cv.width=window.innerWidth;cv.height=window.innerHeight;cv.style.display='block';const ctx=cv.getContext('2d'),COLS=['#10b981','#22c55e','#f59e0b','#ec4899','#3b82f6','#a78bfa'];const pts=Array.from({length:100},()=>({x:Math.random()*cv.width,y:-10,vx:(Math.random()-.5)*4,vy:Math.random()*2.5+1.5,col:COLS[Math.floor(Math.random()*COLS.length)],w:Math.random()*9+4,h:Math.random()*5+3,rot:Math.random()*360,rs:(Math.random()-.5)*6,alpha:1}));let fr=0;const tick=()=>{if(fr>150){cv.style.display='none';ctx.clearRect(0,0,cv.width,cv.height);return;}ctx.clearRect(0,0,cv.width,cv.height);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.07;p.rot+=p.rs;if(fr>100)p.alpha=Math.max(0,p.alpha-.035);ctx.save();ctx.globalAlpha=p.alpha;ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.col;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});fr++;requestAnimationFrame(tick);};requestAnimationFrame(tick);}
function toast(msg,type,dur){type=type||'info';dur=dur||3200;const colors={info:'var(--text2)',success:'var(--clr-up)',error:'var(--clr-down)',warning:'#fcd34d'};const svgs={success:'<polyline points="20 6 9 17 4 12"/>',error:'<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',warning:'<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>',info:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>'};const el=document.createElement('div');el.className='toast';el.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${colors[type]||colors.info}" stroke-width="2.5" stroke-linecap="round">${svgs[type]||svgs.info}</svg><span>${msg}</span>`;const ctr=document.getElementById('toast-ctr');if(ctr.children.length>=3)ctr.removeChild(ctr.firstChild);ctr.appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),280);},dur);}
function startRates(){setInterval(()=>{Object.keys(S.rates).forEach(c=>{if(c==='PKR')return;S.rates[c]=BASE_RATES[c]*(1+(Math.random()-.5)*0.01);});S.ratesTs=Date.now();if(S.activeTab==='home'){const d=document.getElementById('nw-display'),t=document.getElementById('rate-ts');if(d&&!S.balanceHidden)d.textContent=fmtAmt(trueNetWealth());if(t)t.textContent='just now';}},30000);setInterval(()=>{const t=document.getElementById('rate-ts');if(t&&S.activeTab==='home')t.textContent=secsAgo(S.ratesTs)+'s ago';},1000);}
// EVENTS
document.addEventListener('click',e=>{
  // Ripple effect on rpl-host elements
  const rplHost=e.target.closest('.rpl-host,.btn-primary,.btn-secondary,.qa-pill,.shortcut-tile');
  if(rplHost){const r=document.createElement('span');r.className='rpl';const rect=rplHost.getBoundingClientRect();const sz=Math.max(rect.width,rect.height)*1.2;r.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX-rect.left-sz/2}px;top:${e.clientY-rect.top-sz/2}px`;if(!rplHost.classList.contains('rpl-host')){rplHost.style.position='relative';rplHost.style.overflow='hidden';}rplHost.appendChild(r);setTimeout(()=>r.remove(),600);}
  if(S.curDDOpen&&!e.target.closest('#cur-dd-wrapper')){S.curDDOpen=false;if(S.activeTab==='home')renderHome();}
  const el=e.target.closest('[data-action]');if(!el)return;
  const{action,tab,cur,period,modal}=el.dataset;
  switch(action){
    case 'doSignIn': verifySIPin(); break;
    case 'switchTab': switchTab(tab); break;
    case 'closeModal': closeModal(); break;
    case 'setPeriod': S.statementPeriod=period;if(S.activeTab==='home')renderHome();break;
    case 'toggleBalance': S.balanceHidden=!S.balanceHidden;renderHome();break;
    case 'switchCur':
      S.displayCurrency=cur;
      document.querySelectorAll('.cur-pill').forEach(p=>p.classList.toggle('active',p.dataset.cur===cur));
      const nwEl=document.getElementById('nw-display');
      if(nwEl&&!S.balanceHidden){nwEl.style.opacity='0.4';setTimeout(()=>{nwEl.textContent=fmtAmt(trueNetWealth());nwEl.style.opacity='1';},180);}
      break;
    case 'toggleTheme':
      S.themeMode=S.themeMode==='system'?'light':S.themeMode==='light'?'dark':'system';
      applyTheme();
      if(S.activeTab==='more')renderMore();
      break;
    case 'setThemeMode':
      S.themeMode=el.dataset.mode;
      applyTheme();
      if(S.activeTab==='more')renderMore();
      break;
    case 'toggleNotif': el.classList.toggle('on'); break;
    case 'notifBell': toast('No new notifications','info',2000); break;
    case 'chooseLinkType':S.modal.data.linkType=el.dataset.type;advanceStep(1);break;
    case 'selectCryptoWallet':{const w=CRYPTO_WALLETS.find(x=>x.id===el.dataset.walletId);if(w){S.modal.data.selectedCryptoWallet=w;renderModal();}break;}
    case 'toggleIncludeCrypto':S.includeCrypto=!S.includeCrypto;el.classList.toggle('on',S.includeCrypto);if(S.activeTab==='home')renderHome();if(S.activeTab==='accounts')renderAccounts();break;
    case 'toggleCurDD':S.curDDOpen=!S.curDDOpen;if(S.activeTab==='home')renderHome();break;
    case 'setCurFromDD':{const nc=el.dataset.cur;S.displayCurrency=nc;S.curDDOpen=false;if(!S.recentCurrencies.includes(nc)){S.recentCurrencies.unshift(nc);if(S.recentCurrencies.length>3)S.recentCurrencies.pop();}if(S.activeTab==='home')renderHome();break;}
    case 'openCurModal':S.curDDOpen=false;openModal('curSelect');break;
    case 'setCurrency':{const nc2=el.dataset.cur;S.displayCurrency=nc2;if(!S.recentCurrencies.includes(nc2)){S.recentCurrencies.unshift(nc2);if(S.recentCurrencies.length>3)S.recentCurrencies.pop();}closeModal();if(S.activeTab==='home')renderHome();break;}
    case 'signOut':
      closeModal();
      const si2=document.getElementById('signin'),app2=document.getElementById('app');
      app2.style.display='none';si2.style.display='flex';si2.style.animation='fadeIn .4s ease both';
      ['si-name','si-username','si-password'].forEach(id=>{const e2=document.getElementById(id);if(e2)e2.value='';});
      const siErrEl=document.getElementById('si-err');if(siErrEl)siErrEl.style.display='none';
      setTimeout(()=>{const f=document.getElementById('si-username');if(f)f.focus();},100);
      break;
    case 'lbNext': handleLBNext(); break;
    case 'lbBack': S.modal.step=Math.max(0,S.modal.step-1);if(S.modal.step===0){S.modal.data.linkType=null;S.modal.data.selectedBank=null;S.modal.data.selectedCryptoWallet=null;}renderModal(); break;
    case 'selectBank':{const bank=BANKS.find(b=>b.id===el.dataset.bankId);if(bank){S.modal.data.selectedBank=bank;renderModal();}break;}
    case 'verifyOTP': verifyOTP(); break;
    case 'resendOTP': S.modal.data.otpCount=60;startOTPTimer();document.querySelectorAll('[data-otp-idx]').forEach(b=>{b.value='';b.classList.remove('filled');});const oerr=document.getElementById('otp-err');if(oerr)oerr.style.display='none';setTimeout(()=>{const f=document.querySelector('[data-otp-idx="0"]');if(f)f.focus();},60);break;
    case 'completeLinkBank': completeLinkBank(); break;
    case 'toggleFoundAcc':{if(!S.modal.data.selectedAccounts)S.modal.data.selectedAccounts=new Set();const aid=el.dataset.accId;if(S.modal.data.selectedAccounts.has(aid))S.modal.data.selectedAccounts.delete(aid);else S.modal.data.selectedAccounts.add(aid);renderModal();break;}
    case 'txDetail':{const txId=el.dataset.txId;const tx=S.transactions.find(t=>t.id===txId);if(tx)openModal('txDetail',{tx});break;}
    case 'calTx':{const txId2=el.dataset.txId;const tx2=S.transactions.find(t=>t.id===txId2);if(tx2){const isRec=RECURRING_KW.some(k=>tx2.desc.toLowerCase().includes(k));addToCalendar(`${tx2.desc} Payment`,tx2.date,`${tx2.desc} — ${fmtPKR(Math.abs(tx2.amount))} from ${getAcc(tx2.accId)?.bankName||'account'}`,isRec);}break;}
    case 'calDebt':{const d2=S.debts.find(x=>x.id===el.dataset.debtId);if(d2&&d2.due){addToCalendar(`Due: ${d2.label}`,d2.due,`Payment due: ${fmtPKR(d2.total-d2.paid)} remaining${d2.apr>0?` · APR ${d2.apr}%`:''}`,false);}break;}
    case 'addExpense':{
      const desc=document.getElementById('exp-desc')?.value.trim(),amt=parseFloat(document.getElementById('exp-amt')?.value),cat=document.getElementById('exp-cat')?.value,acc=document.getElementById('exp-acc')?.value,date=document.getElementById('exp-date')?.value||new Date().toISOString().slice(0,10);
      if(!desc||isNaN(amt)||amt<=0||!cat||!acc){toast('Fill in all fields','error');break;}
      S.transactions.unshift({id:S.uid(),date,desc,amount:-amt,type:'debit',category:cat,accId:acc});
      toast('Expense added','success');renderSpending();break;
    }
    case 'showAddDebt':{const a=document.getElementById('add-debt-area');if(a)a.style.display=a.style.display==='none'?'block':'none';break;}
    case 'addDebt':{
      const label=document.getElementById('debt-label')?.value.trim(),total=parseFloat(document.getElementById('debt-total')?.value),paid=parseFloat(document.getElementById('debt-paid')?.value)||0,due=document.getElementById('debt-due')?.value,dir=document.getElementById('debt-dir')?.value||'owe',apr=parseFloat(document.getElementById('debt-apr')?.value)||0;
      if(!label||isNaN(total)||total<=0){toast('Enter label and amount','error');break;}
      S.debts.push({id:S.uid(),label,total,paid,due,dir,apr,type:'loan'});
      toast('Added','success');renderMore();break;
    }
    case 'settleDebt':{const idx=S.debts.findIndex(d=>d.id===el.dataset.debtId);if(idx!==-1){const d=S.debts[idx],rem=d.total-d.paid,src=S.accounts[0];if(src&&src.balance>=rem){src.balance-=rem;S.transactions.unshift({id:S.uid(),date:new Date().toISOString().slice(0,10),desc:`Settled: ${d.label}`,amount:-rem,type:'debit',category:'Transfer',accId:src.id});}S.debts.splice(idx,1);toast('Settled!','success');renderMore();}break;}
    case 'removeDebt':{const idx2=S.debts.findIndex(d=>d.id===el.dataset.debtId);if(idx2!==-1){S.debts.splice(idx2,1);toast('Removed','info');renderMore();}break;}
    case 'markReturned': openModal('markReturned',{debtId:el.dataset.debtId}); break;
    case 'confirmReturn':{const debtId=el.dataset.debtId,d=S.debts.find(x=>x.id===debtId);if(d){d.paid=d.total;toast(`${d.label} marked as returned!`,'success');closeModal();renderMore();}break;}
    case 'saveIncome':{const v=parseFloat(document.getElementById('inc-field')?.value);if(isNaN(v)||v<0){toast('Invalid amount','error');break;}S.monthlyIncome=v;toast('Saved','success');break;}
    case 'openModal':
      if(el.dataset.modal==='addGoal'){S._goalColor='#10b981';openModal('addGoal');}
      else if(el.dataset.modal==='transfer'){if(S.accounts.length<2){toast('Link at least 2 accounts to transfer','warning');break;}openModal('transfer');}
      else openModal(el.dataset.modal);
      break;
    case 'trNext': handleTransferNext(); break;
    case 'trBack': S.modal.step=Math.max(1,S.modal.step-1);renderModal(); break;
    case 'trVerifyPin': verifyTransferPin(); break;
    case 'addGoalFunds':{const gid=el.dataset.goalId;const g=S.goals.find(x=>x.id===gid);if(g)openModal('addGoalFunds',{goal:g});break;}
    case 'gfPreset':{const ainput=document.getElementById('gf-amount');if(ainput)ainput.value=el.dataset.amt;break;}
    case 'confirmGoalFunds':{
      const gid=el.dataset.goalId,g=S.goals.find(x=>x.id===gid);
      const amt=parseFloat(document.getElementById('gf-amount')?.value);
      if(!g||isNaN(amt)||amt<=0){toast('Enter a valid amount','error');break;}
      g.saved=Math.min(g.target,g.saved+amt);
      toast(`${fmtPKR(amt)} added to ${g.name}!`,'success');
      closeModal();if(S.activeTab==='more')renderMore();
      break;
    }
    case 'pickGoalColor':
      S._goalColor=el.dataset.color;
      renderModal();
      break;
    case 'saveGoal':{
      const name=(document.getElementById('goal-name')?.value||'').trim();
      const target=parseInt(document.getElementById('goal-target')?.value||'0');
      const saved=Math.min(target,parseInt(document.getElementById('goal-saved')?.value||'0'));
      const emoji=document.getElementById('goal-emoji')?.value||'🎯';
      const deadline=document.getElementById('goal-deadline')?.value||new Date(Date.now()+90*864e5).toISOString().slice(0,10);
      const color=S._goalColor||'#10b981';
      if(!name||target<=0){toast('Please fill name and target amount','error');break;}
      S.goals.push({id:S.uid(),name,target,saved,emoji,color,deadline});
      S._goalColor=null;
      closeModal();
      if(S.activeTab==='more')renderMore();
      toast(`Goal "${name}" created!`,'success');
      break;
    }
  }
});
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('modal-overlay'))closeModal();});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='bank-search'){onBankSearch(t.value);return;}
  if(t.id==='crypto-search'){S.modal.data.cryptoFilter=t.value;renderModal();const inp=document.getElementById('crypto-search');if(inp){inp.focus();inp.setSelectionRange(t.value.length,t.value.length);}return;}
  if(t.dataset.otpIdx!==undefined){handleOTPInput(t,parseInt(t.dataset.otpIdx));return;}
  if(t.dataset.pinIdx!==undefined){handlePINInput(t,parseInt(t.dataset.pinIdx));return;}
});
function handlePINInput(el,idx){el.value=el.value.replace(/\D/g,'').slice(-1);el.classList.toggle('filled',!!el.value);if(el.value&&idx<3){const n=document.querySelector(`[data-pin-idx="${idx+1}"]`);if(n)n.focus();}if(idx===3&&el.value){const all=[0,1,2,3].every(i=>{const e=document.querySelector(`[data-pin-idx="${i}"]`);return e&&e.value;});if(all)setTimeout(verifyTransferPin,120);}}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const t=e.target;if(['si-username','si-password'].includes(t.id)){verifySIPin();return;}}
  if(e.key!=='Backspace')return;
  const t=e.target;
  if(t.dataset.otpIdx!==undefined&&!t.value){const idx=parseInt(t.dataset.otpIdx);if(idx>0){const p=document.querySelector(`[data-otp-idx="${idx-1}"]`);if(p){p.focus();p.value='';p.classList.remove('filled');}}}
  else if(t.dataset.pinIdx!==undefined&&!t.value){const idx=parseInt(t.dataset.pinIdx);if(idx>0){const p=document.querySelector(`[data-pin-idx="${idx-1}"]`);if(p){p.focus();p.value='';p.classList.remove('filled');}}}
});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='c1'||t.id==='c2'){S.modal.data[t.id]=t.checked;updateConsentBtn();}});
function init(){generateAppIcon();applyTheme();setTimeout(()=>{const f=document.getElementById('si-username');if(f)f.focus();},100);}
document.addEventListener('DOMContentLoaded',init);
</script>

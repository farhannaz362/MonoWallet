<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>MonoWallet — All Your Banks, One Place</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c18;--bg2:#0d1221;--bg3:#111827;
  --card:rgba(255,255,255,.04);--card2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --accent:#6366f1;--accent2:#4f46e5;--accent-glow:rgba(99,102,241,.25);
  --teal:#14b8a6;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--pink:#ec4899;
  --text1:#f1f5f9;--text2:#94a3b8;--text3:#475569;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text1);display:flex;justify-content:center}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#app{width:100%;max-width:430px;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative}

/* header */
#app-header{flex-shrink:0;background:rgba(8,12,24,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:50}

/* tabs */
.tab-panel{display:none;flex-direction:column;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 96px}
.tab-panel.active{display:flex;animation:fadeUp .28s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* bottom nav */
#bottom-nav{flex-shrink:0;background:rgba(8,12,24,.94);backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:8px 4px max(8px,env(safe-area-inset-bottom));z-index:100}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 14px;border-radius:12px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:700;letter-spacing:.04em;background:none;border:none;font-family:inherit;transition:color .18s;white-space:nowrap}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active{color:var(--accent)}
.nav-fab{width:50px;height:50px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px var(--accent-glow);transition:all .18s;margin-bottom:4px}
.nav-fab:hover{background:var(--accent2);transform:scale(1.06)}
.nav-fab svg{width:22px;height:22px;stroke:white;fill:none;stroke-width:2.2;stroke-linecap:round}

/* cards */
.glass{background:var(--card);border:1px solid var(--border);border-radius:18px}
.glass-hover:hover{border-color:var(--border2);transition:border-color .2s}

/* wealth card */
.wealth-card{border-radius:22px;padding:22px 22px 18px;background:linear-gradient(135deg,#1e1b4b 0%,#312e81 55%,#3730a3 100%);position:relative;overflow:hidden}
.wealth-card::before{content:'';position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 80% 10%,rgba(255,255,255,.07),transparent 60%),radial-gradient(ellipse at 10% 90%,rgba(255,255,255,.04),transparent 55%);pointer-events:none}
.wealth-card>*{position:relative;z-index:1}

/* mono card */
.mono-card{border-radius:20px;padding:22px;background:linear-gradient(135deg,#312e81,#4f46e5 50%,#7c3aed);position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.mono-card::before{content:'';position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 75% 15%,rgba(255,255,255,.1),transparent 55%);pointer-events:none}
.mono-card>*{position:relative;z-index:1}

/* account card */
.acc-card{border-radius:18px;padding:20px;position:relative;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column;gap:12px}
.acc-card:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.45)}
.acc-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 75% 15%,rgba(255,255,255,.09),transparent 55%)}

/* buttons */
.btn{font-family:inherit;font-weight:700;cursor:pointer;border:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff;border-radius:14px;padding:14px 22px;font-size:15px}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 8px 20px var(--accent-glow)}
.btn-primary:active{transform:none}
.btn-secondary{background:var(--card2);color:var(--text1);border:1px solid var(--border2);border-radius:13px;padding:12px 18px;font-size:14px}
.btn-secondary:hover{background:rgba(255,255,255,.09)}
.btn-ghost{background:none;color:var(--text2);font-size:13px;font-weight:600;padding:7px 11px;border-radius:10px;font-family:inherit;cursor:pointer;border:none;transition:all .15s}
.btn-ghost:hover{color:var(--text1);background:rgba(255,255,255,.05)}
.btn-sm{padding:9px 15px!important;font-size:13px!important;border-radius:10px!important}
.btn-icon{width:40px;height:40px;border-radius:11px;background:var(--card2);border:1px solid var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-icon:hover{border-color:var(--border2);color:var(--text1)}
.btn-xs{padding:7px 13px!important;font-size:12px!important;border-radius:9px!important}

/* form */
.field{background:rgba(255,255,255,.05);border:1.5px solid var(--border);border-radius:12px;color:var(--text1);font-family:inherit;font-size:15px;padding:12px 15px;width:100%;outline:none;transition:border-color .18s,box-shadow .18s;-webkit-appearance:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.13)}
.field::placeholder{color:var(--text3)}
.field option{background:#0d1221}
.lbl{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;display:block}

/* currency pills */
.cur-pill{padding:4px 11px;border-radius:100px;font-size:11px;font-weight:700;cursor:pointer;transition:all .14s;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);background:transparent;font-family:inherit}
.cur-pill.active{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.28)}
.cur-pill:hover:not(.active){background:rgba(255,255,255,.08)}

/* quick actions */
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:transform .15s}
.qa:hover{transform:translateY(-2px)}
.qa-icon{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.qa span{font-size:11px;font-weight:600;color:var(--text2)}

/* tx rows */
.tx-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.tx-row:last-child{border-bottom:none}
.tx-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-sheet{width:100%;max-width:430px;background:var(--bg2);border-radius:24px 24px 0 0;border-top:1px solid var(--border2);max-height:94dvh;overflow-y:auto;padding-bottom:32px;transform:translateY(100%);transition:transform .32s cubic-bezier(.34,1.2,.64,1)}
.modal-overlay.open .modal-sheet{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0}

/* OTP / PIN */
.digit-row{display:flex;gap:8px;justify-content:center}
.digit-box{width:46px;height:54px;border-radius:12px;background:rgba(255,255,255,.06);border:1.5px solid var(--border2);color:var(--text1);font-family:inherit;font-size:22px;font-weight:800;text-align:center;outline:none;transition:border-color .15s,box-shadow .15s;caret-color:var(--accent)}
.digit-box:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.13)}
.digit-box.filled{border-color:rgba(99,102,241,.45);background:rgba(99,102,241,.07)}
.digit-box.err{border-color:var(--red)!important;background:rgba(239,68,68,.08)!important}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .38s ease}

/* step dots */
.sdots{display:flex;gap:5px;justify-content:center}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--border2);transition:all .22s}
.sdot.active{background:var(--accent);width:20px;border-radius:3px}
.sdot.done{background:var(--teal)}

/* bank option */
.bank-opt{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:13px;border:1.5px solid var(--border);cursor:pointer;transition:all .14s;background:rgba(255,255,255,.03)}
.bank-opt:hover{border-color:var(--accent);background:rgba(99,102,241,.06)}
.bank-opt.sel{border-color:var(--accent);background:rgba(99,102,241,.1)}

/* progress */
.prog{background:rgba(255,255,255,.07);border-radius:100px;overflow:hidden}
.prog-fill{border-radius:100px;height:100%;transition:width .55s cubic-bezier(.34,1.4,.64,1)}

/* toast */
#toast-stack{position:fixed;bottom:92px;right:16px;z-index:500;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast-item{display:flex;align-items:center;gap:9px;padding:11px 15px;background:var(--bg3);border:1px solid var(--border2);border-radius:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:13px;font-weight:600;white-space:nowrap;animation:toastIn .28s cubic-bezier(.34,1.4,.64,1)}
@keyframes toastIn{from{opacity:0;transform:translateX(80px)}to{opacity:1;transform:translateX(0)}}
.toast-item.out{animation:toastOut .22s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(80px)}}

/* misc */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;letter-spacing:.04em}
.badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.05em;text-transform:uppercase}
.flag-chip{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.04em}
.flag-large{background:rgba(239,68,68,.12);color:#fca5a5}
.flag-rec{background:rgba(99,102,241,.12);color:#a5b4fc}
.flag-unusual{background:rgba(245,158,11,.12);color:#fcd34d}
.sec-lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:10px 0 4px;display:flex;align-items:center;gap:5px}
.divider{border:none;border-top:1px solid var(--border);margin:2px 0}
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:9999;display:none}

/* account selector */
.acc-sel-btn{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:13px;border:1.5px solid var(--border2);background:rgba(255,255,255,.04);cursor:pointer;transition:border-color .14s;width:100%;font-family:inherit;text-align:left;color:var(--text1)}
.acc-sel-btn:hover,.acc-sel-btn:focus{border-color:var(--accent);outline:none}
</style>
</head>

<div id="toast-stack"></div>
<canvas id="confetti-canvas"></canvas>

const netWealth = () => S.accounts.reduce((s,a)=>s+a.balance,0) + S.monoWallet.balance;
const getAcc = id => S.accounts.find(a=>a.id===id);

function getAccName(id){
  if(id==='monoWallet') return 'MonoWallet';
  const a = getAcc(id); return a ? `${a.bankName} ${a.type}` : id;
}
function getAccBal(id){
  if(id==='monoWallet') return S.monoWallet.balance;
  const a = getAcc(id); return a ? a.balance : 0;
}

function fmtAmt(pkr, currency){
  currency = currency || S.displayCurrency;
  const val = pkr * S.rates[currency];
  const sym = CUR_SYM[currency];
  if(currency==='PKR') return sym + Math.round(val).toLocaleString('en-PK');
  return sym + val.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtPKR(n){ return 'PKR '+Math.abs(Math.round(n)).toLocaleString('en-PK'); }
function fmtDate(ds){
  const d = new Date(ds);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function secsAgo(ts){ return Math.floor((Date.now()-ts)/1000); }

// Smart transaction classification
function classifyTx(tx){
  if(tx.amount >= 0) return [];
  const flags = [];
  const amt = Math.abs(tx.amount);
  const dl = tx.desc.toLowerCase();
  if(amt >= 20000) flags.push({cls:'flag-large', label:'Large Purchase'});
  if(RECURRING_KW.some(k=>dl.includes(k))) flags.push({cls:'flag-rec', label:'Recurring'});
  const peers = S.transactions.filter(t=>t.category===tx.category && t.id!==tx.id && t.amount<0);
  if(peers.length >= 2){
    const avg = peers.reduce((s,t)=>s+Math.abs(t.amount),0)/peers.length;
    if(avg>100 && amt > avg*2.2) flags.push({cls:'flag-unusual', label:`${(amt/avg).toFixed(1)}× avg`});
  }
  return flags;
}

function smartSort(txns){
  const flagged = [], normal = [];
  txns.forEach(tx=>{
    const f = classifyTx(tx);
    if(f.length) flagged.push({tx,flags:f});
    else normal.push({tx,flags:[]});
  });
  flagged.sort((a,b)=>Math.abs(b.tx.amount)-Math.abs(a.tx.amount));
  normal.sort((a,b)=>b.tx.date.localeCompare(a.tx.date));
  return {flagged,normal};
}

function stmtTxns(){
  const now = new Date();
  let cutoff;
  if(S.statementPeriod==='week') cutoff = new Date(Date.now()-7*864e5);
  else if(S.statementPeriod==='3month') cutoff = new Date(Date.now()-90*864e5);
  else cutoff = new Date(now.getFullYear(), now.getMonth(), 1);
  return S.transactions.filter(t=>new Date(t.date)>=cutoff).sort((a,b)=>b.date.localeCompare(a.date));
}

function barChartSVG(){
  const data = S.monthlyChart;
  const maxVal = Math.max(...data.flatMap(d=>[d.inc,d.exp]));
  const W=360,H=140,MB=22,UH=H-MB-8;
  const GW=W/data.length;
  const BW=Math.floor((GW-14)/2);
  let rects='';
  data.forEach((d,i)=>{
    const x=i*GW+7;
    const ih=Math.round((d.inc/maxVal)*UH);
    const eh=Math.round((d.exp/maxVal)*UH);
    rects+=`<rect x="${x}" y="${H-MB-ih}" width="${BW}" height="${ih}" fill="#22c55e" rx="3" opacity=".75"/>
    <rect x="${x+BW+3}" y="${H-MB-eh}" width="${BW}" height="${eh}" fill="#6366f1" rx="3" opacity=".75"/>
    <text x="${x+BW}" y="${H-4}" text-anchor="middle" fill="#475569" font-size="9" font-family="Plus Jakarta Sans,sans-serif">${d.m}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">${rects}</svg>`;
}

function donutChartHTML(){
  const cats = computeCats();
  const total = cats.reduce((s,c)=>s+c.amt,0);
  if(!total) return '<p style="color:var(--text3);font-size:13px;text-align:center;padding:16px 0">No expense data yet</p>';
  const r=65,cx=85,cy=85,sw=22,C=2*Math.PI*r;
  let offset=0;
  let segs='';
  cats.forEach(c=>{
    const frac=c.amt/total;
    const dash=(frac*C).toFixed(2);
    const gap=(C-frac*C).toFixed(2);
    segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c.color}" stroke-width="${sw}" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset+=frac*C;
  });
  const legend = cats.map(c=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0">
      <div style="display:flex;align-items:center;gap:7px">
        <span style="width:10px;height:10px;border-radius:3px;background:${c.color};flex-shrink:0;display:inline-block"></span>
        <span style="font-size:12px;color:var(--text2)">${c.cat}</span>
      </div>
      <span style="font-size:12px;font-weight:700">${fmtPKR(c.amt)}</span>
    </div>`).join('');
  return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
    <div style="position:relative;flex-shrink:0">
      <svg width="${cx*2}" height="${cy*2}" viewBox="0 0 ${cx*2} ${cy*2}">${segs}</svg>
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none">
        <p style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em">Spent</p>
        <p style="font-size:13px;font-weight:800">${fmtPKR(total)}</p>
      </div>
    </div>
    <div style="flex:1;min-width:130px">${legend}</div>
  </div>`;
}

function computeCats(){
  const map={};
  S.transactions.filter(t=>t.amount<0&&t.category!=='Transfer').forEach(t=>{
    map[t.category]=(map[t.category]||0)+Math.abs(t.amount);
  });
  return Object.entries(map).map(([cat,amt])=>({cat,amt,color:CAT_COLORS[cat]||'#64748b'}))
    .sort((a,b)=>b.amt-a.amt).slice(0,7);
}

function debtCardHTML(d){
  const remaining = d.total - d.paid;
  const pct = Math.round((d.paid/d.total)*100);
  const now = new Date(); const due = new Date(d.due);
  const daysLeft = Math.ceil((due-now)/864e5);
  const urgColor = daysLeft<7?'#fca5a5':daysLeft<30?'#fcd34d':'var(--text3)';
  const dirColor = d.dir==='owe'?'rgba(239,68,68,.15)':'rgba(34,197,94,.15)';
  const dirText  = d.dir==='owe'?'YOU OWE':'YOU LENT';
  const dirTxtC  = d.dir==='owe'?'#fca5a5':'#86efac';
  return `<div class="glass" style="padding:16px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">
      <div>
        <span style="font-size:9px;font-weight:800;padding:2px 7px;border-radius:5px;background:${dirColor};color:${dirTxtC};letter-spacing:.06em">${dirText}</span>
        <p style="font-size:15px;font-weight:800;margin-top:5px">${d.label}</p>
        ${d.apr>0?`<p style="font-size:11px;color:var(--text3)">APR ${d.apr}%</p>`:''}
      </div>
      <div style="text-align:right">
        <p style="font-size:18px;font-weight:800;color:${d.dir==='owe'?'#fca5a5':'#86efac'}">${fmtPKR(remaining)}</p>
        <p style="font-size:10px;color:var(--text3)">remaining</p>
      </div>
    </div>
    <div class="prog" style="height:6px;margin-bottom:8px">

function openModal(name, extraData){
  S.modal.active = name;
  S.modal.step   = 1;
  S.modal.data   = extraData || {};
  document.getElementById('modal-overlay').classList.add('open');
  renderModal();
}

function closeModal(){
  if(S.modal.data.otpTimer)  clearInterval(S.modal.data.otpTimer);
  if(S.modal.data.cntTimer)  clearInterval(S.modal.data.cntTimer);
  S.modal = {active:null, step:1, data:{}};
  document.getElementById('modal-overlay').classList.remove('open');
}

function advanceStep(n){
  S.modal.step = n;
  renderModal();
}

function renderModal(){
  const body = document.getElementById('modal-body');
  switch(S.modal.active){
    case 'linkBank':
      body.innerHTML = renderLinkBankStep();
      if(S.modal.step===3){ startOTPTimer(); setTimeout(()=>{ const f=document.querySelector('[data-otp-idx="0"]'); if(f) f.focus(); },60); }
      break;
    case 'topup':
      body.innerHTML = renderTopupModal();
      if(S.modal.step===2) setTimeout(()=>{ const f=document.querySelector('[data-top-idx="0"]'); if(f) f.focus(); },60);
      break;
    case 'virtualCard':
      body.innerHTML = renderVirtualCardModal();
      if(S.modal.step===2) setTimeout(()=>{ const f=document.querySelector('[data-rev-idx="0"]'); if(f) f.focus(); },60);
      break;
    case 'qr':   body.innerHTML = renderQRModal(); break;
    case 'pin':
      body.innerHTML = renderPINModal();
      setTimeout(()=>{ const f=document.querySelector('[data-pin-idx="0"]'); if(f) f.focus(); },60);
      break;
    case 'transfer': S.transferStep=1; S.transferDraft={fromId:'',toId:'',amount:'',purpose:''}; closeModal(); switchTab('transfer'); break;
    default: body.innerHTML = '';
  }
}

function genMockAccounts(b){
  const types=['Current Account','Savings Account','Mobile Wallet','Digital Account'];
  const n=1+Math.floor(Math.random()*2);
  return Array.from({length:n},(_,i)=>({
    id:`${b.id}_lnk_${i}_${Date.now()}`, type:types[i%types.length],
    no:`****${Math.floor(1000+Math.random()*9000)}`,
    balance:Math.floor(15000+Math.random()*480000),
    bankId:b.id, bankName:b.name, color:b.color, abbr:b.abbr,
    linked:new Date().toISOString().slice(0,10),
  }));
}

function onBankSearch(v){
  S.modal.data.bankFilter=v; renderModal();
  const inp=document.getElementById('bank-search');
  if(inp){ inp.focus(); inp.setSelectionRange(v.length,v.length); }
}

function updateConsentBtn(){
  const btn=document.getElementById('consent-btn');
  if(!btn) return;
  const ok=S.modal.data.c1&&S.modal.data.c2;
  btn.disabled=!ok; btn.style.opacity=ok?'1':'.4'; btn.style.cursor=ok?'pointer':'not-allowed';
}

function startOTPTimer(){
  if(S.modal.data.otpTimer) clearInterval(S.modal.data.otpTimer);
  S.modal.data.otpCount=60;
  S.modal.data.otpTimer=setInterval(()=>{
    S.modal.data.otpCount=(S.modal.data.otpCount||1)-1;
    const el=document.getElementById('otp-countdown');
    if(!el){ clearInterval(S.modal.data.otpTimer); return; }
    if(S.modal.data.otpCount>0){
      el.textContent=`Resend in 0:${String(S.modal.data.otpCount).padStart(2,'0')}`;
    } else {
      clearInterval(S.modal.data.otpTimer);
      el.innerHTML='<button class="btn-ghost btn-xs" style="color:var(--accent)" data-action="resendOTP">Resend OTP</button>';
    }
  },1000);
}

function handleLBNext(){
  const s=S.modal.step;
  if(s===1){ if(!S.modal.data.selectedBank){ toast('Select a bank','error'); return; } advanceStep(2); }
  else if(s===2){
    const u=document.getElementById('lb-user')?.value.trim();
    const p=document.getElementById('lb-pass')?.value;
    if(!u||!p){ toast('Enter username and password','error'); return; }
    S.modal.data.username=u; S.modal.data.password=p; advanceStep(3);
  }
  else if(s===3){ verifyOTP(); }
  else if(s===4){
    const c1=document.getElementById('c1')?.checked;
    const c2=document.getElementById('c2')?.checked;
    if(!c1||!c2){ toast('Accept all terms to continue','error'); return; }
    S.modal.data.c1=true; S.modal.data.c2=true; advanceStep(5);
  }
  else if(s===5){ completeLinkBank(); }
}

function verifyOTP(){
  const code=[0,1,2,3,4,5].map(i=>{ const e=document.querySelector(`[data-otp-idx="${i}"]`); return e?e.value:''; }).join('');
  if(code==='123456'){
    advanceStep(4);
  } else {
    document.querySelectorAll('[data-otp-idx]').forEach(b=>{ b.classList.add('err'); b.value=''; });
    const err=document.getElementById('otp-err'); if(err) err.style.display='block';
    setTimeout(()=>{ document.querySelectorAll('[data-otp-idx]').forEach(b=>b.classList.remove('err')); const f=document.querySelector('[data-otp-idx="0"]'); if(f) f.focus(); },500);
  }
}

function completeLinkBank(){
  const b=S.modal.data.selectedBank;
  const accs=S.modal.data.foundAccounts||[];
  const sel=S.modal.data.selectedAccounts||new Set();
  const names=[];
  accs.filter(a=>sel.has(a.id)).forEach(a=>{
    if(S.accounts.find(x=>x.id===a.id)) return;
    S.accounts.push({...a});
    names.push(`${b.name} ${a.type} ${a.no}`);
  });
  S.modal.data.linkedNames=names;
  advanceStep(6);
  launchConfetti();
  toast(`${names.length} account${names.length!==1?'s':''} linked!`,'success');
}

function handleOTPInput(el,idx){
  el.value=el.value.replace(/\D/g,'').slice(-1);
  el.classList.toggle('filled',!!el.value);
  if(el.value&&idx<5){ const n=document.querySelector(`[data-otp-idx="${idx+1}"]`); if(n) n.focus(); }
  if(idx===5&&el.value){ const all=[0,1,2,3,4,5].every(i=>{ const e=document.querySelector(`[data-otp-idx="${i}"]`); return e&&e.value; }); if(all) setTimeout(verifyOTP,120); }
}

function handleDigitInput(el,attr,idx,total,onComplete){
  el.value=el.value.replace(/\D/g,'').slice(-1);
  if(el.value&&idx<total-1){ const n=document.querySelector(`[data-${attr}-idx="${idx+1}"]`); if(n) n.focus(); }
  if(idx===total-1&&el.value){ const all=Array.from({length:total},(_,i)=>{ const e=document.querySelector(`[data-${attr}-idx="${i}"]`); return e&&e.value; }).every(Boolean); if(all) setTimeout(onComplete,120); }
}

function generateQRSVG(data,size){
  const N=21, mat=Array.from({length:N},()=>new Uint8Array(N));
  const finder=(r0,c0)=>{ for(let r=r0;r<r0+7;r++) for(let c=c0;c<c0+7;c++){ if(r>=0&&r<N&&c>=0&&c<N) mat[r][c]=(r===r0||r===r0+6||c===c0||c===c0+6||(r>=r0+2&&r<=r0+4&&c>=c0+2&&c<=c0+4))?1:0; } };
  finder(0,0); finder(0,14); finder(14,0);
  let h=0; for(let i=0;i<data.length;i++) h=((h*31+data.charCodeAt(i))>>>0);
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    if((r<9&&c<9)||(r<9&&c>12)||(r>12&&c<9)) continue;
    mat[r][c]=(((h^(r*N+c)*2654435761)>>>0)&0xFF)>127?1:0;
  }
  const mod=Math.floor(size/N), pad=Math.floor((size-mod*N)/2);
  let rects='';
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(mat[r][c]) rects+=`<rect x="${pad+c*mod}" y="${pad+r*mod}" width="${mod}" height="${mod}" fill="#111"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" fill="white"/>${rects}</svg>`;
}

function launchConfetti(){
  const canvas=document.getElementById('confetti-canvas');
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  canvas.style.display='block';
  const ctx=canvas.getContext('2d');
  const COLS=['#6366f1','#22c55e','#f59e0b','#ec4899','#14b8a6','#f97316','#a78bfa'];
  const pts=Array.from({length:110},()=>({
    x:Math.random()*canvas.width, y:-10,
    vx:(Math.random()-.5)*4, vy:Math.random()*2.5+1.5,
    col:COLS[Math.floor(Math.random()*COLS.length)],
    w:Math.random()*9+4, h:Math.random()*5+3,
    rot:Math.random()*360, rs:(Math.random()-.5)*6, alpha:1
  }));
  let frame=0;
  const tick=()=>{
    if(frame>150){ canvas.style.display='none'; ctx.clearRect(0,0,canvas.width,canvas.height); return; }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.07; p.rot+=p.rs; if(frame>100) p.alpha=Math.max(0,p.alpha-.035);
      ctx.save(); ctx.globalAlpha=p.alpha; ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180); ctx.fillStyle=p.col; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    frame++; requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function toast(msg, type, dur){
  type = type||'info'; dur = dur||3200;
  const colors = {info:'var(--text2)',success:'#4ade80',error:'#f87171',warning:'#fcd34d'};
  const icons = {info:'ℹ️',success:'✅',error:'❌',warning:'⚠️'};
  const el = document.createElement('div');
  el.className = 'toast-item';
  el.style.color = colors[type]||colors.info;
  el.innerHTML = `<span>${icons[type]||''}</span><span style="color:var(--text1)">${msg}</span>`;
  const stack = document.getElementById('toast-stack');
  if(stack.children.length >= 3) stack.removeChild(stack.firstChild);
  stack.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),280); }, dur);
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const {action, tab, cur, period, modal} = el.dataset;

  switch(action){
    // ── Link Bank modal actions ──
    case 'lbNext': handleLBNext(); break;
    case 'lbBack': S.modal.step=Math.max(1,S.modal.step-1); renderModal(); break;
    case 'selectBank': {
      const bank=BANKS.find(b=>b.id===el.dataset.bankId);
      if(bank){ S.modal.data.selectedBank=bank; renderModal(); }
      break;
    }
    case 'verifyOTP': verifyOTP(); break;
    case 'resendOTP': {
      S.modal.data.otpCount=60;
      startOTPTimer();
      document.querySelectorAll('[data-otp-idx]').forEach(b=>{b.value='';b.classList.remove('filled');});
      const errEl=document.getElementById('otp-err'); if(errEl) errEl.style.display='none';
      setTimeout(()=>{ const f=document.querySelector('[data-otp-idx="0"]'); if(f) f.focus(); },60);
      break;
    }
    case 'completeLinkBank': completeLinkBank(); break;

    // ── Transfer PIN modal ──
    case 'verifyPIN': verifyPIN(); break;

    // ── Top-up modal ──
    case 'topupReview': {
      const fromId=document.getElementById('topup-from')?.value;
      const amt=parseFloat(document.getElementById('topup-amt')?.value);
      if(!fromId){ toast('Select a source account','error'); break; }
      if(isNaN(amt)||amt<=0){ toast('Enter a valid amount','error'); break; }
      const srcAcc=getAcc(fromId);
      if(srcAcc&&amt>srcAcc.balance){ toast('Insufficient balance','error'); break; }
      S.modal.data.fromId=fromId; S.modal.data.topupAmt=amt; S.modal.step=2; renderModal();
      break;
    }
    case 'doTopup': doTopupPIN(); break;

    // ── Virtual card modal ──
    case 'startReveal': S.modal.step=2; renderModal(); break;
    case 'revealCard': doRevealCard(); break;
    case 'copyCard': {
      const num=S.monoWallet.card.full.replace(/(\d{4})(?=\d)/g,'$1 ');
      if(navigator.clipboard){ navigator.clipboard.writeText(num).then(()=>toast('Card number copied','success')).catch(()=>toast('Copy failed','error')); }
      else toast('Clipboard not available','error');
      break;
    }
    case 'freezeCard':
      S.monoWallet.card.frozen=!S.monoWallet.card.frozen;
      toast(S.monoWallet.card.frozen?'Card frozen 🔴':'Card unfrozen 🟢','info');
      renderModal(); break;

    // ── Linked accounts selection ──
    case 'toggleFoundAcc': {
      if(!S.modal.data.selectedAccounts) S.modal.data.selectedAccounts=new Set();
      const aid=el.dataset.accId;
      if(S.modal.data.selectedAccounts.has(aid)) S.modal.data.selectedAccounts.delete(aid);
      else S.modal.data.selectedAccounts.add(aid);
      renderModal(); break;
    }

    // ── QR share ──
    case 'shareQR':
      if(navigator.share){ navigator.share({title:'Pay me via MonoWallet',text:'monowallet://pay/FARHAN_NAZ_8847'}).catch(()=>{}); }
      else if(navigator.clipboard){ navigator.clipboard.writeText('monowallet://pay/FARHAN_NAZ_8847').then(()=>toast('Payment link copied!','success')).catch(()=>toast('Copy failed','error')); }
      else toast('Share not supported','error');
      break;

    case 'switchTab':
      switchTab(tab); break;

    case 'switchCur':
      S.displayCurrency = cur;
      document.querySelectorAll('.cur-pill').forEach(p=>p.classList.toggle('active',p.dataset.cur===cur));
      const nwEl = document.getElementById('nw-display');
      if(nwEl){
        nwEl.style.opacity='0.4';
        setTimeout(()=>{ nwEl.textContent=fmtAmt(netWealth()); nwEl.style.opacity='1'; },180);
      }
      break;

    case 'setPeriod':
      S.statementPeriod = period;
      if(S.activeTab==='home') renderHome();
      break;

    case 'openModal':
      openModal(modal); break;

    case 'closeModal':
      closeModal(); break;

    case 'showNotif':
      toast('No new notifications', 'info'); break;

    case 'swapAccounts': {
      const fr = document.getElementById('tr-from');
      const to = document.getElementById('tr-to');
      if(fr&&to){ const t=fr.value; fr.value=to.value; to.value=t; onTrFromChange(); }
      break;
    }

    case 'reviewTransfer': {
      const fr = document.getElementById('tr-from')?.value;
      const to = document.getElementById('tr-to')?.value;
      const amt = parseFloat(document.getElementById('tr-amount')?.value);
      const pur = document.getElementById('tr-purpose')?.value||'';
      if(!fr||!to){ toast('Select both accounts','error'); break; }
      if(fr===to){ toast('Source and destination cannot be the same','error'); break; }
      if(isNaN(amt)||amt<=0){ toast('Enter a valid amount','error'); break; }
      if(amt>getAccBal(fr)){ toast('Insufficient balance','error'); break; }
      S.transferDraft = {fromId:fr, toId:to, amount:amt, purpose:pur};
      S.transferStep = 2;
      renderTransfer();
      const warn = document.getElementById('tr-warn');
      if(warn) warn.style.display = amt>500000 ? 'block' : 'none';
      break;
    }

    case 'backTransfer':
      S.transferStep = 1; renderTransfer(); break;

    case 'newTransfer':
      S.transferStep = 1; S.transferDraft = {fromId:'',toId:'',amount:'',purpose:''}; renderTransfer(); break;

    case 'addExpense': {
      const desc = document.getElementById('exp-desc')?.value.trim();
      const amt  = parseFloat(document.getElementById('exp-amt')?.value);
      const cat  = document.getElementById('exp-cat')?.value;
      const acc  = document.getElementById('exp-acc')?.value;
      const date = document.getElementById('exp-date')?.value || new Date().toISOString().slice(0,10);
      if(!desc||isNaN(amt)||amt<=0||!cat||!acc){ toast('Fill in all fields','error'); break; }
      const emojiMap = {Groceries:'🛒',Transport:'🚗',Utilities:'⚡',Entertainment:'🎬',Dining:'🍽️',Health:'🏥',Shopping:'🛍️',Housing:'🏠',Other:'💸'};
      S.transactions.unshift({id:S.uid(),date,desc,amount:-amt,type:'debit',category:cat,accId:acc,emoji:emojiMap[cat]||'💸'});
      toast('Expense added','success');
      renderSpending();
      break;
    }

    case 'addDebt': {
      const label = document.getElementById('debt-label')?.value.trim();
      const total = parseFloat(document.getElementById('debt-total')?.value);
      const paid  = parseFloat(document.getElementById('debt-paid')?.value)||0;
      const due   = document.getElementById('debt-due')?.value;
      const dir   = document.getElementById('debt-dir')?.value||'owe';
      const apr   = parseFloat(document.getElementById('debt-apr')?.value)||0;
      if(!label||isNaN(total)||total<=0){ toast('Enter label and amount','error'); break; }
      S.debts.push({id:S.uid(),label,total,paid,due,dir,apr,type:'loan'});
      toast('Debt added','success');
      renderMore();
      break;
    }

    case 'saveIncome': {
      const v = parseFloat(document.getElementById('inc-field')?.value);
      if(isNaN(v)||v<0){ toast('Enter a valid amount','error'); break; }
      S.monthlyIncome = v;
      toast('Income saved','success');
      break;
    }

    case 'clearTxns':
      S.transactions = [];
      toast('Transactions cleared','info');
      if(S.activeTab==='more') renderMore();
      if(S.activeTab==='spending') renderSpending();
      if(S.activeTab==='home') renderHome();
      break;

    case 'fullReset':
      S.transactions=[]; S.debts=[]; S.monoWallet.balance=0; S.accounts=[];
      toast('Reset complete','info');
      renderTab(S.activeTab);
      break;
  }
});

// Close modal on overlay click
document.getElementById('modal-overlay').addEventListener('click', e=>{
  if(e.target===document.getElementById('modal-overlay')) closeModal();
});

// ── All input delegation: digit boxes + bank search ──
// handleDigitInput expects the attribute PREFIX (e.g. 'pin'), builds [data-pin-idx="N"]
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='bank-search'){ onBankSearch(t.value); return; }
  if(t.dataset.otpIdx!==undefined){ handleOTPInput(t,parseInt(t.dataset.otpIdx)); return; }
  if(t.dataset.pinIdx!==undefined){ handleDigitInput(t,'pin',parseInt(t.dataset.pinIdx),4,verifyPIN); return; }
  if(t.dataset.topIdx!==undefined){ handleDigitInput(t,'top',parseInt(t.dataset.topIdx),4,doTopupPIN); return; }
  if(t.dataset.revIdx!==undefined){ handleDigitInput(t,'rev',parseInt(t.dataset.revIdx),4,doRevealCard); return; }
});

// ── Backspace: jump to previous digit box ──
document.addEventListener('keydown', e=>{
  if(e.key!=='Backspace') return;
  const t=e.target;
  let prefix=null, idx=-1;
  if(t.dataset.otpIdx!==undefined){ prefix='otp'; idx=parseInt(t.dataset.otpIdx); }
  else if(t.dataset.pinIdx!==undefined){ prefix='pin'; idx=parseInt(t.dataset.pinIdx); }
  else if(t.dataset.topIdx!==undefined){ prefix='top'; idx=parseInt(t.dataset.topIdx); }
  else if(t.dataset.revIdx!==undefined){ prefix='rev'; idx=parseInt(t.dataset.revIdx); }
  if(prefix&&!t.value&&idx>0){ const prev=document.querySelector(`[data-${prefix}-idx="${idx-1}"]`); if(prev){ prev.focus(); prev.value=''; prev.classList.remove('filled'); } }
});

// ── Consent checkboxes ──
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.id==='c1'||t.id==='c2'){ S.modal.data[t.id]=t.checked; updateConsentBtn(); }
});

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
function init(){
  renderBottomNav();
  renderHome();
  startRates();
}

document.addEventListener('DOMContentLoaded', init);
</script>
